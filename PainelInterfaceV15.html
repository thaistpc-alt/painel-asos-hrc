<!-- Interface supplemental V15. The source order preserves the existing CSS cascade and runtime wrapper order. -->
<!-- Performance and shell layer -->
<style>
:root{--menu:#0f172a;--menu2:#1e293b;--app:#f3f6fa;--borda:#dce4ee;--azul:#1d4ed8;--verde:#047857}
*{box-sizing:border-box}body{margin:0!important;padding:82px 0 0 250px!important;background:var(--app)!important;min-height:100vh;transition:.2s}.topo{display:none!important}
.painel-sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:linear-gradient(180deg,var(--menu),var(--menu2));color:#fff;z-index:1000;display:flex;flex-direction:column}.painel-brand{height:82px;padding:18px;display:flex;gap:12px;align-items:center;border-bottom:1px solid rgba(255,255,255,.1)}.painel-logo{width:40px;height:40px;border-radius:10px;background:#fff;color:#0f766e;display:grid;place-items:center;font-weight:800}.painel-brand strong{display:block;font-size:16px}.painel-brand span{font-size:12px;color:#cbd5e1}.painel-sidebar .abas{position:static!important;display:flex!important;flex-direction:column!important;flex-wrap:nowrap!important;gap:5px!important;padding:14px 10px!important;margin:0!important;background:transparent!important;overflow:auto;flex:1}.painel-sidebar .aba{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:transparent!important;color:#dbeafe!important;padding:12px!important;border-radius:10px!important;box-shadow:none!important}.painel-sidebar .aba:hover,.painel-sidebar .aba.ativa{background:rgba(255,255,255,.14)!important;color:#fff!important}.menu-icone{width:24px;text-align:center;flex:0 0 24px}.painel-rodape{padding:10px;border-top:1px solid rgba(255,255,255,.1)}.painel-rodape button{width:100%;background:transparent!important;color:#dbeafe!important;text-align:left;box-shadow:none!important}
.painel-topbar{position:fixed;left:250px;right:0;top:0;height:82px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--borda);z-index:999;display:flex;align-items:center;justify-content:space-between}.painel-topbar h1{margin:0;font-size:22px}.painel-topbar p{margin:4px 0 0;font-size:12px;color:#64748b}.painel-atualizar{height:38px;background:var(--azul)!important;padding:0 14px!important}.painel-atualizar:disabled{opacity:.65;cursor:wait}.painel-sync{font-size:10px;color:#475569;background:#f8fafc;border:1px solid #e2e8f0;border-radius:999px;padding:6px 9px;white-space:nowrap}.painel-topbar-status{display:flex;align-items:center;gap:9px}
.filtros{position:sticky;top:94px;z-index:50;margin:16px 20px 0!important;padding:10px 12px!important;display:flex!important;flex-wrap:nowrap!important;align-items:end!important;gap:8px!important;overflow-x:auto;background:#fff!important;border:1px solid var(--borda)!important;border-radius:12px!important}.filtros>div{flex:0 0 auto;min-width:0!important}.filtros label,.linha-filtros label{font-size:10px!important;margin-bottom:3px!important}.filtros input,.filtros select,.linha-filtros input,.linha-filtros select{height:36px!important;padding:6px 8px!important;font-size:11px!important;min-width:0!important}.filtros>div:nth-child(1),.filtros>div:nth-child(2){width:145px}.filtros>button{height:36px!important;padding:0 11px!important;font-size:11px!important;white-space:nowrap}.filtros .azul[onclick*="atualizarDadosForcado"]{display:none!important}#toolbarModulo{display:flex;align-items:end;gap:8px;flex:0 0 auto}.linha-filtros{display:flex!important;flex-wrap:nowrap!important;align-items:end!important;gap:8px!important;margin:0!important}.linha-filtros>div{min-width:0!important;flex:0 0 auto}.linha-filtros .campo-pesquisa{width:260px!important;flex:0 0 260px!important}.linha-filtros .email-gestor{width:230px!important;min-width:230px!important}.linha-filtros .acoes-lote{display:flex!important;flex-wrap:nowrap!important;gap:6px!important;margin:0!important}.linha-filtros button{height:36px!important;padding:0 9px!important;font-size:10px!important;white-space:nowrap}.loading{font-size:11px!important;white-space:nowrap}.conteudo{margin:16px 20px 0!important;padding:18px!important;border-radius:12px!important}.rodape-info#infoVersao,.rodape-info#infoSincronizacaoAgenda{display:none!important}.tabela-container{max-height:64vh!important;overflow:auto!important}th{position:sticky;top:0}.dashboard-grafico{margin-top:18px}.dashboard-grafico h3{margin:0 0 10px}.grafico-vazio{padding:14px;color:#64748b;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px}.paginacao-geral{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;padding:9px 12px;background:#f8fafc;border:1px solid var(--borda);border-radius:9px;font-size:11px;color:#475569}.paginacao-acoes{display:flex;align-items:center;gap:8px}.paginacao-acoes label{display:flex;align-items:center;gap:5px}.paginacao-acoes select{height:30px}.paginacao-acoes button{height:30px;padding:0 10px!important}.paginacao-acoes button:disabled{opacity:.45;cursor:not-allowed}.periodo-atalho{height:32px!important;padding:0 8px!important;background:#f8fafc!important;color:#334155!important;border:1px solid #cbd5e1!important}.card[data-destino]{cursor:pointer;transition:transform .12s,box-shadow .12s}.card[data-destino]:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(15,23,42,.09)}
.painel-sidebar .menu-grupo{padding:13px 12px 5px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;font-size:9px;font-weight:700}.consulta-assistida{margin-top:18px;padding:18px;background:#fff;border:1px solid var(--borda);border-radius:12px}.consulta-assistida h3{margin:0 0 6px}.consulta-assistida p{color:#64748b;font-size:12px}.consulta-linha{display:flex;gap:8px;max-width:760px}.consulta-linha input{flex:1;min-width:0;height:38px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px}.consulta-linha button{padding:0 16px!important;background:var(--azul)!important;color:white}.consulta-aso-item{padding:12px 0;border-bottom:1px solid #e2e8f0}.consulta-aso-item p{color:#1e293b}.consulta-aso-item small{color:#64748b}.consulta-aso-item details{margin-top:8px;font-size:11px}
body.menu-fechado{padding-left:76px!important}.menu-fechado .painel-sidebar{width:76px}.menu-fechado .painel-brand div:last-child,.menu-fechado .aba-texto,.menu-fechado .toggle-texto,.menu-fechado .menu-grupo{display:none}.menu-fechado .painel-topbar{left:76px}
@media(max-width:1000px){body{padding-left:76px!important}.painel-sidebar{width:76px}.painel-brand div:last-child,.aba-texto,.toggle-texto{display:none}.painel-topbar{left:76px}.filtros,.conteudo{margin-left:10px!important;margin-right:10px!important}}
</style>
<script>
(function(){
  const ICONES={abaColaboradores:'⌕',abaFaltosos:'↻',abaPrioridade:'!',abaConvocar:'✉',abaComplementares:'⌁',abaVencidos:'⚠',abaIndicadores:'▥'};
  const NOMES={abaColaboradores:'Colaboradores',abaFaltosos:'Pendências',abaPrioridade:'A vencer',abaConvocar:'Agenda e convocação',abaComplementares:'Exames complementares',abaVencidos:'Atrasados',abaIndicadores:'Indicadores'};
  const MODULOS={convocar:'CONVOCAR',faltosos:'PENDENCIAS',prioridade:'PRIORIDADE',vencidos:'VENCIDOS',complementares:'COMPLEMENTARES',colaboradores:'COLABORADORES',indicadores:'INDICADORES'};
  const carregados=new Set(),origens=new Map();
  let filtroAtivo=null,abaAtual='convocar',requisicao=0,timerGrafico=null,graficoCarregado=false;
  const periodo=()=>({inicio:document.getElementById('dataInicio').value,fim:document.getElementById('dataFim').value});
  const chaveModulo=id=>{const p=periodo();return p.inicio+'|'+p.fim+'|'+id};
  function debounce(fn,ms){let t;return function(){clearTimeout(t);const a=arguments,c=this;t=setTimeout(()=>fn.apply(c,a),ms)}}

  function aplicarRotulosMenu(){
    Object.keys(NOMES).forEach(id=>{const el=document.getElementById(id);if(!el)return;const cont=(el.textContent.match(/\(\d+\)/)||[])[0]||'';el.innerHTML='<span class="menu-icone">'+ICONES[id]+'</span><span class="aba-texto">'+NOMES[id]+(cont?' '+cont:'')+'</span>'});
    const h=document.querySelector('#colaboradores h2');if(h)h.textContent='Colaboradores';
  }

  function prepararPesquisas(){
    const mapa={pesquisaConvocar:()=>filtrarConvocacaoPorSituacao(),pesquisaFaltosos:()=>filtrarPendencias(),pesquisaPrioridade:()=>filtrarTabelaPorTexto('tabelaPrioridade','pesquisaPrioridade'),pesquisaVencidos:()=>filtrarTabelaPorTexto('tabelaVencidos','pesquisaVencidos'),pesquisaComplementares:()=>filtrarComplementares(),pesquisaColaboradores:()=>filtrarColaboradores()};
    Object.keys(mapa).forEach(id=>{const el=document.getElementById(id);if(!el)return;el.removeAttribute('oninput');el.oninput=debounce(mapa[id],250)});
    document.querySelectorAll('.linha-filtros label').forEach(l=>{const t=l.textContent.trim().toLowerCase();if(t.startsWith('filtrar situação'))l.textContent='Situação';if(t==='grupo')l.textContent='Grupo de exame'});
  }

  function prepararGestoresV15(){
    const ids=['emailGestorConvocacao','emailGestorPendencia'];
    if(!ids.some(id=>document.getElementById(id)))return;
    google.script.run.withSuccessHandler(lista=>{
      let dl=document.getElementById('gestoresV15Lista');
      if(!dl){dl=document.createElement('datalist');dl.id='gestoresV15Lista';document.body.appendChild(dl)}
      dl.innerHTML=(lista||[]).map(g=>{
        const label=[g.nome,g.setor].filter(Boolean).join(' — ');
        return '<option value="'+String(g.email||'').replace(/"/g,'&quot;')+'" label="'+String(label).replace(/"/g,'&quot;')+'"></option>'
      }).join('');
      ids.forEach(id=>{const el=document.getElementById(id);if(el){el.setAttribute('list','gestoresV15Lista');el.title='Digite ou selecione um gestor cadastrado'}})
    }).withFailureHandler(()=>{}).obterGestoresV15();
  }

  function prepararGraficoDashboard(){
    const dashboard=document.getElementById('dashboard');
    const indicadores=document.getElementById('indicadores');
    const colaboradores=document.getElementById('colaboradores');
    if(!dashboard||!indicadores||!colaboradores)return;

    let grafico=document.getElementById('dashboardGrafico');
    if(!grafico){
      grafico=document.createElement('div');
      grafico.id='dashboardGrafico';
      grafico.className='dashboard-grafico';
      grafico.innerHTML='<h3>Desempenho mensal da meta</h3><div id="dashboardGraficoConteudo" class="grafico-vazio">Carregando gráfico...</div>';
      dashboard.appendChild(grafico);
    }

    const cartoes=dashboard.querySelector('.cards');
    const referencia=indicadores.querySelector('.painel-indicador-topo');
    if(cartoes&&cartoes.parentElement!==indicadores)indicadores.insertBefore(cartoes,referencia||indicadores.querySelector('h2')?.nextSibling||null);
    if(grafico.parentElement!==indicadores)indicadores.insertBefore(grafico,referencia||indicadores.querySelector('h2')?.nextSibling||null);

    let consulta=document.getElementById('consultaAssistidaAso');
    if(!consulta){
      consulta=document.createElement('section');
      consulta.id='consultaAssistidaAso';
      consulta.className='consulta-assistida';
      consulta.innerHTML='<h3>Consulta assistida de ASO</h3><p>Pesquise por nome, matrícula, função ou setor. A resposta mostra a evidência registrada na base e na agenda.</p><div class="consulta-linha"><input id="consultaAsoTermo" type="search" placeholder="Ex.: matrícula ou nome"><button id="consultaAsoBotao" type="button">Consultar</button></div><div id="consultaAsoResultado" aria-live="polite"></div>';
    }
    const filtroColaboradores=colaboradores.querySelector('.linha-filtros');
    colaboradores.insertBefore(consulta,filtroColaboradores||colaboradores.querySelector('#tabelaColaboradores')||null);

    dashboard.style.display='none';
    indicadores.style.display='block';
    document.getElementById('abaDashboard')?.remove();
    document.querySelectorAll('.aba').forEach(b=>b.classList.remove('ativa'));
    document.getElementById('abaIndicadores')?.classList.add('ativa');

    const input=consulta.querySelector('#consultaAsoTermo'),botao=consulta.querySelector('#consultaAsoBotao');
    const buscar=()=>{const termo=input.value.trim(),saida=consulta.querySelector('#consultaAsoResultado');if(termo.length<2){saida.textContent='Digite pelo menos 2 caracteres.';return}botao.disabled=true;saida.textContent='Consultando registros…';google.script.run.withSuccessHandler(r=>{botao.disabled=false;renderConsultaAssistida(saida,r)}).withFailureHandler(e=>{botao.disabled=false;saida.textContent=e.message||'Falha ao consultar os registros.'}).consultarDiagnosticoASO(termo)};
    botao.onclick=buscar;input.addEventListener('keydown',e=>{if(e.key==='Enter')buscar()});
  }
  function escaparConsulta(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function renderConsultaAssistida(el,r){if(!r||!r.resultados||!r.resultados.length){el.textContent=(r&&r.mensagem)||'Nenhum registro encontrado.';return}el.innerHTML=r.resultados.map(x=>'<article class="consulta-aso-item"><strong>'+escaparConsulta(x.nome)+' · '+escaparConsulta(x.matricula)+'</strong><p>'+escaparConsulta(x.explicacao)+'</p><small>Fontepainel linha '+escaparConsulta(x.linhaFonte||'—')+' · último ASO '+escaparConsulta(x.ultimoAso||'sem data')+' ('+escaparConsulta(x.tipoUltimoAso)+') · vencimento '+escaparConsulta(x.vencimento||'sem data')+' · convocação '+escaparConsulta(x.convocacao||'sem data')+(x.pendencia?' · AGENDA linha '+escaparConsulta(x.pendencia.linhaAgenda||'—')+' em '+escaparConsulta(x.pendencia.data||'sem data'):'')+'</small>'+(x.eventosAgenda&&x.eventosAgenda.length?'<details><summary>Ver registros recentes da agenda</summary><ul>'+x.eventosAgenda.map(e=>'<li>'+escaparConsulta(e.dataBR)+' · '+escaparConsulta(e.tipo)+' · '+escaparConsulta(e.status)+' · linha '+escaparConsulta(e.linhaAgenda||'—')+'</li>').join('')+'</ul></details>':'')+'</article>').join('')}

  function renderGrafico(resumo){
    const el=document.getElementById('dashboardGraficoConteudo');if(!el)return;
    const itens=(resumo&&resumo.resumoMensal)||[];
    if(!itens.length){el.className='grafico-vazio';el.textContent='Sem dados para o período.';return}
    el.className='grafico-meta';el.innerHTML=itens.map(i=>{const p=Math.max(0,Math.min(100,Math.round((Number(i.percentual)||0)*100)));const m=String(i.mesAnalise||i.mes||'');return '<div class="linha-grafico"><span>'+m.substring(5,7)+'/'+m.substring(0,4)+'</span><div class="barra-externa"><div class="barra-interna" style="width:'+p+'%"></div></div><strong>'+p+'%</strong></div>'}).join('');
  }

  function carregarGrafico(){
    if(graficoCarregado)return;
    const p=periodo();
    google.script.run.withSuccessHandler(r=>{graficoCarregado=true;renderGrafico(r)}).withFailureHandler(()=>{const el=document.getElementById('dashboardGraficoConteudo');if(el){el.className='grafico-vazio';el.textContent='Não foi possível carregar o gráfico.'}}).obterGraficoPortalV13(p.inicio,p.fim);
  }

  function agendarGrafico(){
    if(graficoCarregado)return;
    if(timerGrafico)clearTimeout(timerGrafico);
    timerGrafico=setTimeout(()=>{timerGrafico=null;if(abaAtual==='indicadores')carregarGrafico()},700);
  }

  function montarShell(){
    if(document.querySelector('.painel-sidebar'))return;
    const abas=document.querySelector('.abas');if(!abas)return;
    const painelDashboard=document.getElementById('dashboard');
    const indicadores=document.getElementById('indicadores');
    const cardsDashboard=painelDashboard&&painelDashboard.querySelector('.cards');
    if(cardsDashboard&&indicadores&&!indicadores.contains(cardsDashboard)){
      const resumo=document.createElement('section');
      resumo.className='resumo-geral-indicadores';
      resumo.innerHTML='<h3>Resumo geral</h3>';
      resumo.appendChild(cardsDashboard);
      const referencia=indicadores.querySelector('.painel-indicador-topo');
      indicadores.insertBefore(resumo,referencia||indicadores.firstChild);
    }
    const abaDashboard=document.getElementById('abaDashboard');
    if(abaDashboard)abaDashboard.remove();
    if(painelDashboard)painelDashboard.style.display='none';
    [['Operação',['abaConvocar','abaFaltosos','abaPrioridade','abaVencidos']],['Consulta e gestão',['abaColaboradores','abaComplementares','abaIndicadores']]].forEach(g=>{const titulo=document.createElement('div');titulo.className='menu-grupo';titulo.textContent=g[0];abas.appendChild(titulo);g[1].forEach(id=>{const el=document.getElementById(id);if(el)abas.appendChild(el)})});
    const sidebar=document.createElement('aside');sidebar.className='painel-sidebar';sidebar.innerHTML='<div class="painel-brand"><div class="painel-logo">S</div><div><strong>SESMT HRC</strong><span>Painel de ASOs</span></div></div>';sidebar.appendChild(abas);
    const rodape=document.createElement('div');rodape.className='painel-rodape';rodape.innerHTML='<button type="button"><span class="menu-icone">↤</span><span class="toggle-texto">Recolher menu</span></button>';sidebar.appendChild(rodape);document.body.appendChild(sidebar);
    const top=document.createElement('header');top.className='painel-topbar';top.innerHTML='<div><h1>PAINEL DE ASOS SESMT HRC</h1><p>Gestão de exames ocupacionais e convocações</p></div><div class="painel-topbar-status"><span id="painelSync" class="painel-sync">Base: aguardando leitura</span><button class="painel-atualizar" type="button">Atualizar dados</button></div>';document.body.appendChild(top);
    top.querySelector('.painel-atualizar').onclick=()=>atualizarDadosForcado();rodape.querySelector('button').onclick=()=>document.body.classList.toggle('menu-fechado');
    const barra=document.querySelector('.filtros'),area=document.createElement('div');area.id='toolbarModulo';barra.appendChild(area);barra.querySelectorAll('button').forEach(b=>{if(String(b.getAttribute('onclick')||'').includes('limparFiltrosLocais'))b.textContent='Limpar'});
    document.querySelectorAll('.conteudo .linha-filtros').forEach(el=>origens.set(el,{pai:el.parentNode,proximo:el.nextSibling}));
    aplicarRotulosMenu();prepararGraficoDashboard();prepararPesquisas();prepararGestoresV15();
  }

  function atualizarStatusBase(meta){
    const el=document.getElementById('painelSync');if(!el)return;
    const ultima=meta&&meta.ultimaSincronizacaoBase?meta.ultimaSincronizacaoBase:'';
    el.textContent=ultima?'Base atualizada: '+ultima:'Base materializada';
    el.title=meta&&meta.geradoEm?'Painel processado em '+meta.geradoEm:'';
  }

  function definirAtualizandoBase(ativo){
    const b=document.querySelector('.painel-atualizar');if(!b)return;
    b.disabled=!!ativo;b.textContent=ativo?'Sincronizando...':'Atualizar dados';
  }

  function abrirDestinoCard(id){
    const botao=document.getElementById(id);if(botao&&typeof window.abrirAba==='function')window.abrirAba(
      {abaConvocar:'convocar',abaFaltosos:'faltosos',abaPrioridade:'prioridade',abaComplementares:'complementares',abaVencidos:'vencidos',abaColaboradores:'colaboradores'}[id]||'dashboard',
      botao
    );
  }

  function ativarCardsDashboard(){
    const mapa={totalConvocar:'abaConvocar',totalAgendados:'abaConvocar',totalCompareceram:'abaColaboradores',totalFaltosos:'abaFaltosos',totalPrioridade:'abaPrioridade',totalComplementares:'abaComplementares',totalVencidos:'abaVencidos',totalVencidosAtivos:'abaVencidos'};
    Object.keys(mapa).forEach(id=>{const n=document.getElementById(id),card=n&&n.closest('.card');if(!card||card.dataset.destino)return;card.dataset.destino=mapa[id];card.title='Abrir '+(document.getElementById(mapa[id])?.textContent||'detalhes');card.onclick=()=>abrirDestinoCard(mapa[id])});
  }

  function moverFiltro(id){
    if(filtroAtivo){const o=origens.get(filtroAtivo);if(o&&o.pai.isConnected)o.pai.insertBefore(filtroAtivo,o.proximo);filtroAtivo=null}
    const area=document.getElementById('toolbarModulo');if(!area)return;area.innerHTML='';const linha=document.querySelector('#'+id+' .linha-filtros');if(linha){area.appendChild(linha);filtroAtivo=linha}
    document.dispatchEvent(new Event('painel:filtro-movido'));
  }

  function carregarResumo(forcar){
    const p=periodo();if(!p.inicio||!p.fim){mostrarErro('Informe a data inicial e a data final.');return}
    carregados.clear();
    graficoCarregado=false;
    const token=++requisicao;mostrarLoading(true);limparMensagens();if(forcar){carregados.clear();dadosPortal=null;graficoCarregado=false;definirAtualizandoBase(true);if(timerGrafico){clearTimeout(timerGrafico);timerGrafico=null}}
    google.script.run.withSuccessHandler(r=>{if(token!==requisicao)return;carregados.clear();dadosPortal={dashboard:r.dashboard,meta:r.meta||{}};periodoCarregadoPortal=p.inicio+'|'+p.fim;atualizarDashboard(r.dashboard);atualizarNomesAbas(r.dashboard);aplicarRotulosMenu();atualizarStatusBase(r.meta||{});ativarCardsDashboard();mostrarLoading(false);definirAtualizandoBase(false);if(forcar)mostrarOk('Base sincronizada e painel atualizado.');if(abaAtual==='indicadores')agendarGrafico();if(abaAtual!=='dashboard')carregarModulo(abaAtual,forcar)}).withFailureHandler(e=>{mostrarLoading(false);definirAtualizandoBase(false);mostrarErro(e.message||e)}).obterResumoPortalV13Leve(p.inicio,p.fim,!!forcar);
  }

  function carregarModulo(id,forcar){
    const nome=MODULOS[id];if(!nome||id==='dashboard')return;const chave=chaveModulo(id);if(!forcar&&carregados.has(chave)){renderizarModulo(id);return}
    const token=requisicao;
    const p=periodo();mostrarLoading(true);google.script.run.withSuccessHandler(r=>{if(token!==requisicao || chave!==chaveModulo(id))return;dadosPortal=Object.assign(dadosPortal||{},r||{});carregados.add(chave);mostrarLoading(false);if(id===abaAtual)renderizarModulo(id)}).withFailureHandler(e=>{mostrarLoading(false);mostrarErro(e.message||e)}).obterModuloPortalV13(nome,p.inicio,p.fim,!!forcar);
  }

  function renderizarModulo(id){
    if(id==='convocar'){carregarFiltroSituacao('filtroSituacaoConvocar',dadosPortal.convocar.todos,'');filtrarConvocacaoPorSituacao()}
    else if(id==='faltosos')filtrarPendencias();
    else if(id==='prioridade')renderizarTabelaSeparada('tabelaPrioridade',dadosPortal.prioridadeAtivos,dadosPortal.prioridadeOutros,'Colaboradores ativos','Colaboradores em outras situações',true);

<script>
(function(){
  let tokenGeral=0;
  const norm=v=>String(v||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

  function removerLimparAntigo(){document.querySelectorAll('.filtros>button,#toolbarModulo>button,.linha-filtros>button').forEach(b=>{if(b.textContent.trim().toLowerCase()==='limpar'&&!b.classList.contains('painel-limpar-periodo'))b.remove();});}
  function moverPeriodo(){
    const filtros=document.querySelector('.filtros');
    const seletor=filtros&&filtros.querySelector('.filtro-data-wrap');
    if(!filtros||!seletor)return;
    removerLimparAntigo();
    if(filtros.querySelector('.painel-topbar-periodo'))return;

    const inicio=document.getElementById('dataInicio');
    const fim=document.getElementById('dataFim');
    const popover=document.getElementById('popoverPeriodo');
    if(!inicio||!fim||!popover)return;

    // Mantém o controle completo junto: gatilho, calendário e botões de período.
    const periodo=document.createElement('div');
    periodo.className='painel-topbar-periodo';
    periodo.appendChild(seletor);
    // Retira o popover da barra para que nenhum contêiner o recorte ou comprima.
    if(popover.parentElement!==document.body)document.body.appendChild(popover);

    let atalhos=periodo.querySelector('.painel-periodo-atalhos');
    if(!atalhos){
      atalhos=document.createElement('div');
      atalhos.className='painel-periodo-atalhos';

      [['Mês atual',0],['Mês seguinte',1]].forEach(cfg=>{
        const b=document.createElement('button');
        b.type='button';
        b.className='periodo-atalho';
        b.textContent=cfg[0];
        b.onclick=function(){
          const h=new Date(),base=new Date(h.getFullYear(),h.getMonth()+cfg[1],1);
          inicio.value=formatarDataInput(new Date(base.getFullYear(),base.getMonth(),1));
          fim.value=formatarDataInput(new Date(base.getFullYear(),base.getMonth()+1,0));
          atualizarTextoPeriodo();
          aplicarPeriodoSelecionado();
        };
        atalhos.appendChild(b);
      });

      const limpar=document.createElement('button');
      limpar.type='button';
      limpar.className='painel-limpar-periodo';
      limpar.textContent='Limpar';
      limpar.onclick=function(){
        const h=new Date();
        inicio.value=formatarDataInput(new Date(h.getFullYear(),h.getMonth(),1));
        fim.value=formatarDataInput(new Date(h.getFullYear(),h.getMonth()+1,0));
        if(typeof limparFiltrosLocais==='function')limparFiltrosLocais();
        document.querySelectorAll('.linha-filtros input[type="text"],.linha-filtros input[type="email"]').forEach(el=>el.value='');
        document.querySelectorAll('.linha-filtros select').forEach(el=>el.value='');
        const busca=document.getElementById('pesquisaConvocar');
        const origem=document.getElementById('filtroGrupoConvocacaoV15');
        const gestor=document.getElementById('emailGestorConvocacao');
        if(busca)busca.value='';
        if(origem)origem.value='';
        if(gestor)gestor.value='';
        atualizarTextoPeriodo();
        aplicarPeriodoSelecionado();
      };
      atalhos.appendChild(limpar);
      periodo.appendChild(atalhos);
    }

    const area=filtros.querySelector('#toolbarModulo');
    filtros.insertBefore(periodo,area||filtros.firstChild);
  }

  function moverPesquisaParaCabecalho(){
    const status=document.querySelector('.painel-topbar-status');
    const carregando=document.getElementById('loading');
    const atualizar=status&&status.querySelector('.painel-atualizar');
    if(!status)return;
    if(carregando&&carregando.parentElement!==status)status.insertBefore(carregando,atualizar||null);
  }

  function ajustarConvocar(){const th=[...document.querySelectorAll('#tabelaConvocar thead th')].find(c=>norm(c.textContent)==='MATRICULA');if(th){th.textContent='MAT';th.dataset.quebrado='1';}}
  function quebrarCabecalhos(){const mapa={'DATA CONVOCAR':'Data<br>convocar','DATA LIMITE':'Data<br>limite','DATA AGENDADA':'Data<br>agendada','STATUS AGENDA':'Status<br>agenda','ULTIMA PENDENCIA':'Última<br>pendência','NOVA DATA':'Nova<br>data','PROX. VENC.':'Próx.<br>venc.','DATA LIMITE PARA REALIZAR':'Data limite<br>para realizar','DATA REALIZADA':'Data<br>realizada','VENCIMENTO AVALIADO':'Vencimento<br>avaliado','MES ANALISADO':'Mês<br>analisado'};document.querySelectorAll('.conteudo table thead th').forEach(th=>{if(th.querySelector('input'))return;const k=norm(th.textContent).replace(/\s+/g,' ');if(mapa[k]&&th.dataset.quebrado!=='1'){th.innerHTML=mapa[k];th.dataset.quebrado='1'}});ajustarConvocar();}

  function carregarGeralSeguro(){const inicio=document.getElementById('dataInicio')?.value||'',fim=document.getElementById('dataFim')?.value||'';if(!inicio||!fim)return;const meuToken=++tokenGeral,div=document.getElementById('tabelaColaboradores');if(div)div.innerHTML='<div class="vazio">Carregando colaboradores...</div>';google.script.run.withSuccessHandler(r=>{if(meuToken!==tokenGeral)return;const ai=document.getElementById('dataInicio')?.value||'',af=document.getElementById('dataFim')?.value||'';if(ai!==inicio||af!==fim)return;dadosPortal=Object.assign(dadosPortal||{},r||{});filtrarColaboradores();quebrarCabecalhos()}).withFailureHandler(e=>{if(meuToken===tokenGeral&&div)div.innerHTML='<div class="vazio">Erro ao carregar colaboradores: '+escaparHtml(e.message||e)+'</div>'}).obterModuloPortalV13('COLABORADORES',inicio,fim,false);}

  // V15: o filtro operacional de situação é único e é montado pelo bloco final do code.gs.
  // Mantemos apenas os ajustes visuais desta camada, evitando criar e remover um segundo filtro.
  window.carregarFiltroSituacao=function(){};
  const limparOriginal=window.limparFiltrosLocais;window.limparFiltrosLocais=function(){if(typeof limparOriginal==='function')limparOriginal()};
  const abrirOriginal=window.abrirAba;window.abrirAba=function(id,botao){abrirOriginal(id,botao);removerLimparAntigo();setTimeout(()=>{quebrarCabecalhos();ajustarIndicadores()},0)};

  const renderComplementaresOriginal=window.renderizarComplementares;window.renderizarComplementares=function(lista){if(typeof renderComplementaresOriginal==='function')renderComplementaresOriginal(lista);const cards=document.getElementById('cardsComplementares');if(cards)cards.innerHTML='';const tabela=document.querySelector('#tabelaComplementares table');if(tabela&&!tabela.querySelector('th[data-situacao]')){tabela.querySelectorAll('tr').forEach((tr,idx)=>{const cel=document.createElement(idx===0?'th':'td');if(idx===0){cel.textContent='Situação';cel.dataset.situacao='1';tr.insertBefore(cel,tr.children[5]||null)}else{const item=(lista||[])[idx-1];cel.textContent=item&&item.situacao||'';tr.insertBefore(cel,tr.children[5]||null)}})}quebrarCabecalhos()};

  function ajustarIndicadores(){const grafico=document.getElementById('graficoMetaMensal');if(grafico){const titulo=grafico.previousElementSibling;if(titulo&&norm(titulo.textContent)==='DESEMPENHO MENSAL DA META')titulo.remove();grafico.remove()}document.querySelectorAll('#analiseIndicadorMensal .analise-bloco h3 span:first-child').forEach(s=>{if(norm(s.textContent).includes('ASOS ATRASADOS REALIZADOS NO MES DA ANALISE'))s.textContent='Atrasados no vencimento — relação nominal'});quebrarCabecalhos()}
  const renderIndicadoresOriginal=window.renderizarIndicadores;window.renderizarIndicadores=function(ind){if(typeof renderIndicadoresOriginal==='function')renderIndicadoresOriginal(ind);ajustarIndicadores()};
  function iniciar(){moverPeriodo();moverPesquisaParaCabecalho();removerLimparAntigo();quebrarCabecalhos();ajustarIndicadores()}
  document.addEventListener('painel:montar-barra', iniciar, {once:true});
})();
</script>

<script>
(function(){
  'use strict';

  function posicionarListaSituacao(botao){
    const bloco=botao&&botao.closest('.filtro-situacao-check');
    const lista=bloco&&bloco.querySelector('.filtro-situacao-check-lista');
    if(!bloco||!lista)return;

    const r=botao.getBoundingClientRect();
    const largura=Math.max(280,Math.round(r.width));
    const margem=8;
    let esquerda=r.left;
    if(esquerda+largura>window.innerWidth-margem){
      esquerda=Math.max(margem,window.innerWidth-largura-margem);
    }

    lista.style.width=largura+'px';
    lista.style.left=Math.round(esquerda)+'px';
    lista.style.top=Math.round(r.bottom+6)+'px';
  }

  document.addEventListener('click',function(evento){
    const botao=evento.target.closest&&evento.target.closest('.filtro-situacao-check-botao');
    if(!botao)return;
    setTimeout(function(){posicionarListaSituacao(botao);},0);
  },true);

  window.addEventListener('resize',function(){
    document.querySelectorAll('.filtro-situacao-check.aberto .filtro-situacao-check-botao').forEach(posicionarListaSituacao);
  });

  window.addEventListener('scroll',function(){
    document.querySelectorAll('.filtro-situacao-check.aberto .filtro-situacao-check-botao').forEach(posicionarListaSituacao);
  },true);
})();
</script>
<script>
(function(){
  function normalizarTextoAjuste(v){return String(v||" ").trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
  function consolidarToolbarConvocar(){
    const linha=document.querySelector("#toolbarModulo .linha-filtros")||document.querySelector("#convocar .linha-filtros");
    if(!linha)return;
    const labels=[...linha.querySelectorAll("label")].filter(l=>normalizarTextoAjuste(l.textContent)==="SITUACAO");
    labels.forEach((label,indice)=>{if(indice>0)label.remove();});
    const desmarcar=linha.querySelector("button[onclick*=\"marcarConvocacoesVisiveis(false)\"]");
    if(desmarcar)desmarcar.textContent="Desmarcar";
  }
  document.addEventListener("DOMContentLoaded",()=>{setTimeout(consolidarToolbarConvocar,0);setTimeout(consolidarToolbarConvocar,500);});
  document.addEventListener("click",evento=>{if(evento.target.closest&&evento.target.closest("#abaConvocar"))setTimeout(consolidarToolbarConvocar,0);},true);
})();
</script>

<script>
(function(){
  function posicionarPopoverPeriodo(){
    const botao=document.getElementById('botaoPeriodo');
    const popover=document.getElementById('popoverPeriodo');
    if(!botao||!popover||!popover.classList.contains('aberto'))return;
    const r=botao.getBoundingClientRect(),margem=12;
    const {width:largura, height:altura}=popover.getBoundingClientRect();
    const esquerda=Math.max(margem,Math.min(r.left,window.innerWidth-largura-margem));
    const abaixo=r.bottom+8;
    const topo=abaixo+altura<=window.innerHeight-margem
      ? abaixo
      : Math.max(margem,r.top-altura-8);
    popover.style.left=Math.round(esquerda)+'px';
    popover.style.top=Math.round(topo)+'px';
  }
  const botaoPeriodo=document.getElementById('botaoPeriodo');
  botaoPeriodo.onclick=function(evento){
    alternarSeletorPeriodo(evento);
    posicionarPopoverPeriodo();
  };
  window.addEventListener('resize',posicionarPopoverPeriodo);
  window.addEventListener('scroll',posicionarPopoverPeriodo,true);
})();
</script>

<script>
(function(){
  'use strict';
  // Cada aba mantém sua própria caixa de pesquisa e seu valor.
  const locais = new Map();
  let pesquisaAtiva = null;
  document.addEventListener('painel:filtro-movido', function () {
    if (pesquisaAtiva) {
      locais.get(pesquisaAtiva).after(pesquisaAtiva);
      pesquisaAtiva.classList.remove('painel-busca-global');
    }
    pesquisaAtiva = document.querySelector('#toolbarModulo .campo-pesquisa');
    if (!pesquisaAtiva) return;
    if (!locais.has(pesquisaAtiva)) {
      const posicao = document.createComment('pesquisa');
      pesquisaAtiva.before(posicao);
      locais.set(pesquisaAtiva, posicao);
    }
    pesquisaAtiva.classList.add('painel-busca-global');
    document.getElementById('painelSync').before(pesquisaAtiva);
  });
})();
</script>

<script>
(function () {
  'use strict';

  const FIXAS = ['ATIVO', 'FERIAS'];
  const estado = {
    convocar: new Set(FIXAS),
    complementares: new Set(FIXAS)
  };

  function portalAtual() {
    return typeof dadosPortal !== 'undefined' && dadosPortal ? dadosPortal : null;
  }

  function processamentoAtivo() {
    return typeof loteEmProcessamento !== 'undefined' && loteEmProcessamento === true;
  }

  function definirProcessamento(valor) {
    if (typeof loteEmProcessamento !== 'undefined') loteEmProcessamento = valor;
  }

  function normalizar(valor) {
    return String(valor || '')
      .trim()
      .toUpperCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  }

  function listaConvocar() {
    const portal = portalAtual();
    return portal && portal.convocar && Array.isArray(portal.convocar.todos)
      ? portal.convocar.todos
      : [];
  }

  function listaComplementares() {
    const portal = portalAtual();
    return portal && Array.isArray(portal.examesComplementares)
      ? portal.examesComplementares
      : [];
  }

  function obterSituacoes(lista) {
    return [...new Set((lista || []).map(item => item.situacao).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b));
  }

  function assinaturaSituacoes(lista) {
    return obterSituacoes(lista).map(normalizar).join('|');
  }

  function textoResumo(tipo, lista) {
    const selecionadas = obterSituacoes(lista)
      .filter(situacao => estado[tipo].has(normalizar(situacao)));

    if (!lista.length) return 'Ativo, Férias';
    if (selecionadas.length === 0) return 'Selecione';
    if (selecionadas.length <= 2) return selecionadas.join(', ');
    return selecionadas.slice(0, 2).join(', ') + ' +' + (selecionadas.length - 2);
  }

  function fecharFiltros(exceto) {
    document.querySelectorAll('.filtro-situacao-check.aberto').forEach(elemento => {
      if (elemento !== exceto) elemento.classList.remove('aberto');
    });
  }

  document.addEventListener('click', function () {
    fecharFiltros(null);
  });

  function renderizarFiltro(tipo, lista, referencia) {
    if (!referencia) return null;

    const linha = referencia.closest('.linha-filtros');
    if (!linha) return null;

    linha.querySelectorAll('.situacao-multipla').forEach(elemento => elemento.remove());

    const assinatura = assinaturaSituacoes(lista);
    let bloco = linha.querySelector('.filtro-situacao-check[data-tipo="' + tipo + '"]');

    if (bloco && bloco.dataset.assinatura === assinatura) {
      const botaoExistente = bloco.querySelector('.filtro-situacao-check-botao');
      if (botaoExistente) botaoExistente.textContent = textoResumo(tipo, lista);
      return bloco;
    }

    if (bloco) bloco.remove();

    bloco = document.createElement('div');
    bloco.className = 'filtro-situacao-check';
    bloco.dataset.tipo = tipo;
    bloco.dataset.assinatura = assinatura;
    bloco.innerHTML =
      '<label>Situação</label>' +
      '<button type="button" class="filtro-situacao-check-botao"></button>' +
      '<div class="filtro-situacao-check-lista"></div>';

    const alvo = referencia.closest('div');
    linha.insertBefore(bloco, alvo || linha.firstChild);

    const botao = bloco.querySelector('.filtro-situacao-check-botao');
    const caixa = bloco.querySelector('.filtro-situacao-check-lista');

    obterSituacoes(lista).forEach(situacao => {
      const chave = normalizar(situacao);
      const fixa = FIXAS.includes(chave);
      if (fixa) estado[tipo].add(chave);

      const label = document.createElement('label');
      label.className = 'filtro-situacao-check-opcao' + (fixa ? ' fixa' : '');

      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = fixa || estado[tipo].has(chave);
      input.disabled = fixa;

      const texto = document.createElement('span');
      texto.textContent = situacao;

      label.appendChild(input);
      label.appendChild(texto);
      caixa.appendChild(label);

      input.addEventListener('change', function () {
        if (input.checked) estado[tipo].add(chave);
        else estado[tipo].delete(chave);

        botao.textContent = textoResumo(tipo, lista);
        if (tipo === 'convocar') filtrarConvocarEstavel();
        else filtrarComplementaresEstavel();
      });
    });

    botao.textContent = textoResumo(tipo, lista);
    botao.addEventListener('click', function (evento) {
      evento.stopPropagation();
      const abrir = !bloco.classList.contains('aberto');
      fecharFiltros(bloco);
      bloco.classList.toggle('aberto', abrir);
    });

    caixa.addEventListener('click', function (evento) {
      evento.stopPropagation();
    });

    return bloco;
  }

  function montarFiltroGrupoConvocacaoV15() {
    const referencia = document.getElementById('filtroSituacaoConvocar');
    const linha = referencia && referencia.closest('.linha-filtros');
    if (!linha) return;

    let select = document.getElementById('filtroGrupoConvocacaoV15');
    if (!select) {
      const bloco = document.createElement('div');
      bloco.className = 'filtro-grupo-convocacao-v15';
      const label = document.createElement('label');
      label.textContent = 'Origem da convocação';
      select = document.createElement('select');
      select.id = 'filtroGrupoConvocacaoV15';
      bloco.append(label, select);
      const alvo = linha.querySelector(':scope > .acoes-lote');
      linha.insertBefore(bloco, alvo || null);
      select.addEventListener('change', filtrarConvocarEstavel);
    }

    const selecionada = select.value;
    const origens = [...new Set(listaConvocar()
      .map(item => String(item.grupoConvocacao || '').trim())
      .filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    select.replaceChildren();
    const todas = document.createElement('option');
    todas.value = '';
    todas.textContent = 'Todas';
    select.appendChild(todas);
    origens.forEach(origem => {
      const opcao = document.createElement('option');
      opcao.value = origem;
      opcao.textContent = origem;
      select.appendChild(opcao);
    });
    select.value = origens.includes(selecionada) ? selecionada : '';
  }

  function montarFiltroConvocar() {
    const select = document.getElementById('filtroSituacaoConvocar');
    const lista = listaConvocar();
    if (!select) return;
    renderizarFiltro('convocar', lista, select);
    montarFiltroGrupoConvocacaoV15();
  }

  function montarFiltroComplementares() {
    const grupo = document.getElementById('filtroGrupoComplementar');
    const lista = listaComplementares();
    if (!grupo || !lista.length) return;
    renderizarFiltro('complementares', lista, grupo);
  }

  function filtrarConvocarEstavel() {
    const portal = portalAtual();
    if (!portal || !portal.convocar) return;

    const termo = typeof obterTermoPesquisa === 'function'
      ? obterTermoPesquisa('pesquisaConvocar')
      : '';
    const grupoEl = document.getElementById('filtroGrupoConvocacaoV15');
    const grupo = grupoEl ? grupoEl.value || '' : '';

    const filtrados = listaConvocar().filter(item =>
      estado.convocar.has(normalizar(item.situacao)) &&
      (!grupo || item.grupoConvocacao === grupo) &&
      (!termo || correspondePesquisa(item, termo))
    );

    if (typeof renderizarConvocar === 'function') renderizarConvocar(filtrados);
  }

  function filtrarComplementaresEstavel() {
    const portal = portalAtual();
    if (!portal) return;

    const grupo = document.getElementById('filtroGrupoComplementar');
    const grupoSelecionado = grupo ? grupo.value || '' : '';
    const termo = typeof obterTermoPesquisa === 'function'
      ? obterTermoPesquisa('pesquisaComplementares')
      : '';

    const filtrados = listaComplementares().filter(item =>
      estado.complementares.has(normalizar(item.situacao)) &&
      (!grupoSelecionado || item.grupoComplementar === grupoSelecionado) &&
      (!termo || correspondePesquisaComplementar(item, termo))
    );

    if (typeof renderizarComplementares === 'function') {
      renderizarComplementares(filtrados);
    }
  }

  function removerColunaPrioridadeComplementares() {
    const tabela = document.querySelector('#tabelaComplementares table');
    if (!tabela) return;

    const cabecalhos = Array.from(tabela.querySelectorAll('thead th'));
    const indice = cabecalhos.findIndex(th => normalizar(th.textContent) === 'PRIORIDADE');
    if (indice < 0) return;

    tabela.querySelectorAll('tr').forEach(linha => {
      if (linha.children[indice]) linha.children[indice].remove();
    });
  }

  function examesComplementaresSelecionados(matriculas) {
    const chaves = new Set((matriculas || []).map(valor => String(valor || '').trim()));

    return listaComplementares().filter(item =>
      chaves.has(String(item.mat || '').trim()) ||
      chaves.has(String(item.matricula || '').trim()) ||
      chaves.has(String(item.matriculaCompleta || '').trim())
    );
  }

  function confirmarExamesComplementares(matriculas) {
    const itens = examesComplementaresSelecionados(matriculas);
    if (!itens.length) return true;

    const linhas = itens.map(item =>
      '• ' + (item.nome || 'Sem nome') + ' — ' +
      (item.grupoComplementar || 'Exame complementar')
    ).join('\n');

    return window.confirm(
      'ATENÇÃO: os colaboradores abaixo necessitam realizar exames complementares antes do ASO:\n\n' +
      linhas +
      '\n\nConfirme se os exames já foram realizados ou providenciados. Deseja continuar com o envio ao gestor?'
    );
  }

  function enviarLoteGestorComCopia(matriculas, emailGestor) {
    if (processamentoAtivo()) {
      mostrarErro('Já existe uma geração/envio em lote em andamento. Aguarde finalizar.');
      return;
    }

    const lista = [...new Set((matriculas || []).map(String).filter(Boolean))];
    if (!lista.length) {
      mostrarErro('Nenhuma matrícula válida para enviar.');
      return;
    }

    if (!confirmarExamesComplementares(lista)) return;

    const dataInicio = document.getElementById('dataInicio').value;
    const dataFim = document.getElementById('dataFim').value;

    if (!dataInicio || !dataFim) {
      mostrarErro('Informe a data inicial e a data final.');
      return;
    }

    limparMensagens();
    limparStatusLote();

    const tamanhoLote = 30;
    let indice = 0;
    let sucesso = 0;
    let ignorados = 0;
    let falhas = 0;
    const motivos = {};

    definirProcessamento(true);
    mostrarLoading(true);
    atualizarProgressoLote(0, lista.length, 'Enviando convocações ao gestor');
    lista.forEach(mat => definirStatusLote(mat, 'aguardando-lote', '...', 'Aguardando envio'));

    function processarProximo() {
      const lote = lista.slice(indice, indice + tamanhoLote);

      if (!lote.length) {
        definirProcessamento(false);
        mostrarLoading(false);
        atualizarProgressoLote(lista.length, lista.length, sucesso ? 'Envio finalizado: ' + sucesso + ' enviada(s)' : 'Nenhum e-mail enviado');

        const resumo = Object.keys(motivos)
          .map(motivo => motivo + ': ' + motivos[motivo])
          .join(' | ');

        let texto = sucesso + ' convocação(ões) enviada(s) para ' + emailGestor +
          ', com cópia para thais.tpc@isgh.org.br. ' +
          ignorados + ' ignorado(s). ' + falhas + ' falha(s).';

        if (resumo) texto += ' Motivos: ' + resumo + '.';
        if (sucesso === 0) mostrarErro(texto);
        else mostrarOk(texto);
        return;
      }

      google.script.run
        .withSuccessHandler(function (resultados) {
          (resultados || []).forEach(resultado => {
            const mat = String(resultado.matricula || '');

            if (resultado.sucesso) {
              sucesso++;
              definirStatusLote(mat, 'ok-lote', '@', resultado.arquivo || 'Convocação enviada');
            } else if (resultado.ignorado) {
              ignorados++;
              const motivo = resultado.motivo || 'Ignorado';
              motivos[motivo] = (motivos[motivo] || 0) + 1;
              definirStatusLote(mat, 'erro-lote', '!', motivo);
            } else {
              falhas++;
              definirStatusLote(mat, 'erro-lote', 'X', resultado.erro || 'Falha ao enviar');
            }
          });

          indice += lote.length;
          atualizarProgressoLote(
            Math.min(indice, lista.length),
            lista.length,
            'Enviando convocações ao gestor'
          );
          setTimeout(processarProximo, 300);
        })
        .withFailureHandler(function (erro) {
          lote.forEach(mat => definirStatusLote(mat, 'erro-lote', 'X', erro.message || erro));
          falhas += lote.length;
          indice += lote.length;
          atualizarProgressoLote(
            Math.min(indice, lista.length),
            lista.length,
            'Continuando após falha do lote'
          );
          setTimeout(processarProximo, 600);
        })
        .enviarConvocacoesSelecionadasGestorComCopia(
          lote,
          emailGestor,
          dataInicio,
          dataFim
        );
    }

    processarProximo();
  }

  function enviarPendenciaGestorComCopia(mat, dataAnteriorBR) {
    if (processamentoAtivo()) {
      mostrarErro('Já existe uma geração/envio em lote em andamento. Aguarde finalizar.');
      return;
    }

    const emails = typeof obterEmailsGestor === 'function' ? obterEmailsGestor() : [];
    if (!emails.length) {
      mostrarErro('Informe o e-mail do gestor antes de enviar a pendência.');
      return;
    }

    const invalidos = emails.filter(email => !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email));
    if (invalidos.length) {
      mostrarErro('E-mail(s) inválido(s): ' + invalidos.join(', '));
      return;
    }

    if (!confirmarExamesComplementares([mat])) return;

    const dataInicio = document.getElementById('dataInicio').value;
    const dataFim = document.getElementById('dataFim').value;

    if (!dataInicio || !dataFim) {
      mostrarErro('Informe a data inicial e a data final.');
      return;
    }

    limparMensagens();
    mostrarLoading(true);
    definirProcessamento(true);

    google.script.run
      .withSuccessHandler(function (resultados) {
        definirProcessamento(false);
        mostrarLoading(false);

        const resultado = (resultados || [])[0] || {};
        if (resultado.sucesso) {
          mostrarOk('Nova convocação enviada ao gestor, com cópia para thais.tpc@isgh.org.br.');
          carregarDados(true);
        } else if (resultado.ignorado) {
          mostrarErro(resultado.motivo || 'Convocação ignorada.');
        } else {
          mostrarErro(resultado.erro || 'Falha ao enviar nova convocação.');
        }
      })
      .withFailureHandler(function (erro) {
        definirProcessamento(false);
        mostrarLoading(false);
        mostrarErro(erro.message || erro);
      })
      .enviarReconvocacaoPendenciaGestorComCopia(
        mat,
        emails.join('; '),
        dataInicio,
        dataFim,
        dataAnteriorBR
      );
  }

  document.addEventListener('painel:montar-barra', montarFiltroConvocar, {once:true});

  const abrirAbaOriginal = window.abrirAba;
  window.abrirAba = function (id, botao) {
    abrirAbaOriginal(id, botao);
    setTimeout(function () {
      if (id === 'convocar') montarFiltroConvocar();
      if (id === 'complementares') {
        montarFiltroComplementares();
        removerColunaPrioridadeComplementares();
      }
    }, 0);
  };

  const renderizarConvocarOriginal = window.renderizarConvocar;
  window.renderizarConvocar = function (lista) {
    renderizarConvocarOriginal(lista);
    montarFiltroConvocar();
  };

  const renderizarComplementaresOriginal = window.renderizarComplementares;
  window.renderizarComplementares = function (lista) {
    renderizarComplementaresOriginal(lista);
    montarFiltroComplementares();
    removerColunaPrioridadeComplementares();
  };
