<style>
/* Barra superior compacta: no máximo duas linhas */
.layout-topbar{height:82px!important;padding:14px 24px!important}
body.layout-sesmt{padding-top:82px!important}
.layout-topbar-acoes{display:flex;align-items:center;gap:8px;margin-left:auto}
.layout-topbar-atualizar{height:38px!important;padding:0 14px!important;border-radius:8px!important;background:#1d4ed8!important;color:#fff!important;font-size:12px!important;font-weight:700!important;white-space:nowrap}

.filtros{
  top:94px!important;
  display:grid!important;
  grid-template-columns:150px 150px auto auto minmax(0,1fr)!important;
  grid-template-rows:auto auto!important;
  gap:8px 10px!important;
  align-items:end!important;
  padding:14px 16px!important;
}
.filtros>div:not(#filtrosModuloTopo):not(#filtroSituacaoGlobal){min-width:0!important}
.filtros label{font-size:11px!important;margin-bottom:4px!important}
.filtros input,.filtros select{height:38px!important;padding:7px 10px!important;font-size:12px!important;border-radius:8px!important}
.filtros>button{height:38px!important;padding:0 13px!important;font-size:12px!important;white-space:nowrap!important}
#filtrosModuloTopo{grid-column:1/-1!important;grid-row:2!important;display:block!important;min-width:0!important;width:100%!important}
#filtroSituacaoGlobal{grid-column:1/-1!important;grid-row:3!important}
#filtrosModuloTopo:empty{display:none!important}
#filtrosModuloTopo .linha-filtros{
  display:grid!important;
  grid-template-columns:170px minmax(240px,1fr) auto!important;
  gap:8px 10px!important;
  align-items:end!important;
  width:100%!important;
  margin:0!important;
  flex-wrap:nowrap!important;
}
#filtrosModuloTopo .campo-pesquisa{min-width:0!important;width:auto!important}
#filtrosModuloTopo .acoes-lote,
#filtrosModuloTopo .prioridade-acoes{
  display:flex!important;
  flex-wrap:nowrap!important;
  gap:7px!important;
  align-items:end!important;
  min-width:0!important;
}
#filtrosModuloTopo .email-gestor{width:230px!important;min-width:230px!important}
#filtrosModuloTopo button{height:38px!important;padding:0 11px!important;font-size:11px!important;white-space:nowrap!important}
.info-copia-fixa{font-size:9px!important;line-height:1.15!important;margin-top:2px!important}
#loading{font-size:12px!important;align-self:center!important}

/* A caixa de situações, quando usada, permanece compacta na segunda linha visual */
#filtroSituacaoGlobal{padding:5px 8px!important;gap:5px!important;max-height:38px!important;overflow-x:auto!important;flex-wrap:nowrap!important}

@media(max-width:1250px){
  #filtrosModuloTopo .linha-filtros{grid-template-columns:145px minmax(200px,1fr) auto!important}
  #filtrosModuloTopo .email-gestor{width:190px!important;min-width:190px!important}
  #filtrosModuloTopo button{padding:0 8px!important;font-size:10px!important}
}
</style>
<script>
(function(){
  function compactarCabecalho(){
    const topbar=document.querySelector('.layout-topbar');
    const atualizar=document.querySelector('.filtros button.azul[onclick*="atualizarDadosForcado"]');
    if(topbar&&atualizar){
      let acoes=topbar.querySelector('.layout-topbar-acoes');
      if(!acoes){acoes=document.createElement('div');acoes.className='layout-topbar-acoes';topbar.appendChild(acoes)}
      atualizar.classList.add('layout-topbar-atualizar');
      atualizar.textContent='Atualizar dados';
      acoes.appendChild(atualizar);
    }
    const limpar=Array.from(document.querySelectorAll('.filtros button')).find(b=>String(b.getAttribute('onclick')||'').includes('limparFiltrosLocais'));
    if(limpar)limpar.textContent='Limpar';
  }
  document.addEventListener('DOMContentLoaded',compactarCabecalho);
  setTimeout(compactarCabecalho,150);
})();
</script>
