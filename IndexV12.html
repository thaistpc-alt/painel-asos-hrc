<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--nav:#0f172a;--nav2:#1e293b;--primary:#0f766e;--accent:#2563eb;--bg:#f4f7fb;--border:#dce4ee;--text:#172033;--muted:#64748b;--danger:#b91c1c;--warning:#b45309}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    .app{display:flex;min-height:100vh}.sidebar{width:250px;background:linear-gradient(180deg,var(--nav),var(--nav2));color:#fff;position:fixed;inset:0 auto 0 0;transition:.25s;z-index:30;display:flex;flex-direction:column}.sidebar.recolhida{width:76px}
    .brand{padding:22px 18px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;gap:12px;align-items:center}.logo{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--primary);display:grid;place-items:center;font-weight:800}.brand-texto strong{display:block}.brand-texto span{font-size:12px;color:#cbd5e1}.sidebar.recolhida .brand-texto,.sidebar.recolhida .nav-texto,.sidebar.recolhida .recolher-texto{display:none}
    .nav{padding:14px 10px;overflow:auto;flex:1}.nav button,.menu-footer button{width:100%;border:0;background:transparent;color:#dbeafe;padding:12px;border-radius:10px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center;margin-bottom:5px;font-size:13px}.nav button:hover,.nav button.ativo,.menu-footer button:hover{background:rgba(255,255,255,.12);color:#fff}.icone{width:26px;text-align:center;font-size:17px}.menu-footer{padding:10px;border-top:1px solid rgba(255,255,255,.1)}
    .principal{margin-left:250px;width:calc(100% - 250px);transition:.25s}.principal.expandida{margin-left:76px;width:calc(100% - 76px)}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.topbar h1{margin:0;font-size:20px}.topbar p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .conteudo{padding:22px}.painel{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 5px 18px rgba(15,23,42,.05);padding:18px;margin-bottom:16px}.filtros{display:grid;grid-template-columns:180px 180px minmax(220px,1fr) auto auto;gap:10px;align-items:end}.campo label{display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:5px}.campo input,.campo select{width:100%;height:38px;border:1px solid #cbd5e1;border-radius:9px;padding:0 10px;background:#fff}.btn{height:38px;border:0;border-radius:9px;padding:0 14px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff}.btn.sec{background:#475569}.btn.azul{background:var(--accent)}.btn.alerta{background:#b45309}.btn.pequeno{height:30px;padding:0 9px;font-size:11px}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#fff;border:1px solid var(--border);border-radius:13px;padding:15px}.card span{font-size:11px;color:var(--muted);font-weight:700}.card strong{display:block;font-size:27px;margin-top:8px;color:var(--primary)}.cabecalho-modulo{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap}.cabecalho-modulo h2{margin:0;font-size:18px}.cabecalho-modulo small{color:var(--muted)}.acoes{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.acoes .campo{min-width:260px}
    .tabela-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;max-height:65vh}table{width:100%;border-collapse:collapse;min-width:1100px;font-size:11px}th{position:sticky;top:0;background:#eef3f8;color:#334155;text-transform:uppercase;font-size:9px;z-index:2}th,td{padding:8px 7px;border-bottom:1px solid #e5eaf0;text-align:left}tr:hover td{background:#f8fafc}.check{width:16px;height:16px}.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:800;background:#dbeafe;color:#1e40af}.badge.critico{background:#fee2e2;color:#991b1b}.badge.urgente{background:#ffedd5;color:#9a3412}.badge.atencao{background:#fef3c7;color:#92400e}.badge.programado{background:#dcfce7;color:#166534}.secao{margin-top:18px}.secao h3{font-size:15px;margin:0 0 9px;display:flex;justify-content:space-between}.contador{background:#e2e8f0;padding:3px 8px;border-radius:999px;font-size:11px}.loading,.erro,.vazio{padding:20px;text-align:center;color:var(--muted)}.erro{color:var(--danger);background:#fef2f2;border-radius:10px}.oculto{display:none!important}.rodape{margin-top:10px;color:var(--muted);font-size:11px}
    @media(max-width:900px){.sidebar{width:76px}.brand-texto,.nav-texto,.recolher-texto{display:none}.principal{margin-left:76px;width:calc(100% - 76px)}.filtros{grid-template-columns:1fr 1fr}.conteudo{padding:12px}}
  </style>
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><div class="logo">S</div><div class="brand-texto"><strong>SESMT HRC</strong><span>Painel de ASOs</span></div></div>
    <nav class="nav">
      <button class="ativo" onclick="abrirModulo('dashboard',this)"><span class="icone">▦</span><span class="nav-texto">Visão Geral</span></button>
      <button onclick="abrirModulo('convocar',this)"><span class="icone">✉</span><span class="nav-texto">Convocar</span></button>
      <button onclick="abrirModulo('exames',this)"><span class="icone">⌁</span><span class="nav-texto">Exames Complementares</span></button>
      <button onclick="abrirModulo('prioridades',this)"><span class="icone">!</span><span class="nav-texto">Prioridades</span></button>
      <button onclick="abrirModulo('vencidos',this)"><span class="icone">⚠</span><span class="nav-texto">Vencidos</span></button>
      <button onclick="abrirModulo('pendencias',this)"><span class="icone">↻</span><span class="nav-texto">Pendências</span></button>
      <button onclick="abrirModulo('consulta',this)"><span class="icone">⌕</span><span class="nav-texto">Consulta de ASO</span></button>
      <button onclick="abrirModulo('indicadores',this)"><span class="icone">▥</span><span class="nav-texto">Indicadores</span></button>
    </nav>
    <div class="menu-footer"><button onclick="alternarMenu()"><span class="icone">⇤</span><span class="recolher-texto">Recolher menu</span></button></div>
  </aside>
  <main id="principal" class="principal">
    <header class="topbar"><div><h1>PAINEL DE ASOS SESMT HRC</h1><p id="subtitulo">Gestão de saúde ocupacional e acompanhamento de vencimentos</p></div><div id="statusAtualizacao" style="font-size:11px;color:#64748b"></div></header>
    <section class="conteudo">
      <div class="painel filtros">
        <div class="campo"><label>Data inicial</label><input type="date" id="dataInicio"></div>
        <div class="campo"><label>Data final</label><input type="date" id="dataFim"></div>
        <div class="campo"><label>Pesquisar na listagem</label><input id="pesquisa" placeholder="Nome, matrícula, função ou setor" oninput="aplicarPesquisa()"></div>
        <button class="btn" onclick="atualizarPeriodo(false)">Filtrar</button>
        <button class="btn sec" onclick="atualizarPeriodo(true)">Atualizar</button>
      </div>
      <div id="mensagemErro" class="erro oculto"></div><div id="areaPrincipal"></div>
    </section>
  </main>
</div>
<script>
let moduloAtual='dashboard',dadosModulo=[],cacheTela={},selecionadas=new Set();
const titulos={dashboard:'Visão Geral',convocar:'Convocar colaboradores',exames:'Exames Complementares',prioridades:'Prioridades',vencidos:'ASOs vencidos',pendencias:'Pendências de comparecimento',consulta:'Consulta de ASO',indicadores:'Indicadores'};
document.addEventListener('DOMContentLoaded',()=>{const h=new Date(),i=new Date(h.getFullYear(),h.getMonth(),1),f=new Date(h.getFullYear(),h.getMonth()+1,0);dataInicio.value=iso(i);dataFim.value=iso(f);carregarResumo(false)});
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function alternarMenu(){sidebar.classList.toggle('recolhida');principal.classList.toggle('expandida')}
function periodo(){return{inicio:dataInicio.value,fim:dataFim.value}}
function atualizarPeriodo(forcar){cacheTela={};selecionadas.clear();pesquisa.value='';moduloAtual==='dashboard'?carregarResumo(forcar):carregarModulo(moduloAtual,forcar)}
function abrirModulo(m,el){moduloAtual=m;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('ativo'));if(el)el.classList.add('ativo');subtitulo.textContent=titulos[m];pesquisa.value='';m==='dashboard'?carregarResumo(false):carregarModulo(m,false)}
function loading(t){areaPrincipal.innerHTML='<div class="painel loading">'+(t||'Carregando dados...')+'</div>';mensagemErro.classList.add('oculto')}
function erro(e){mensagemErro.textContent=e&&e.message?e.message:String(e);mensagemErro.classList.remove('oculto');areaPrincipal.innerHTML=''}
function carregarResumo(forcar){loading('Carregando visão geral...');const p=periodo();google.script.run.withSuccessHandler(renderResumo).withFailureHandler(erro).obterResumoPortalV12(p.inicio,p.fim,!!forcar)}
function renderResumo(r){statusAtualizacao.textContent='Atualizado em '+r.meta.geradoEm;const d=r.dashboard;areaPrincipal.innerHTML='<div class="cards">'+card('Colaboradores',d.totalColaboradores)+card('Para convocar',d.totalConvocar)+card('Agendados no período',d.totalAgendados)+card('ASOs realizados',d.totalRealizados)+card('Pendências',d.totalPendencias,'warning')+card('Prioridade ≤ 30 dias',d.totalPrioridade,'warning')+card('Vencidos',d.totalVencidos,'danger')+card('Exames complementares',d.totalExamesComplementares)+card('Exames sem ASO agendado',d.examesSemAgendamentoAso,'warning')+'</div><div class="painel" style="margin-top:16px"><b>Carregamento otimizado</b><p style="color:#64748b;font-size:13px">A agenda histórica agora só é lida quando o menu Pendências é aberto.</p></div>'}
function card(t,n,c){return'<div class="card"><span>'+t+'</span><strong style="'+(c==='danger'?'color:#b91c1c':c==='warning'?'color:#b45309':'')+'">'+(n||0)+'</strong></div>'}
function carregarModulo(m,forcar){const p=periodo(),k=m+'_'+p.inicio+'_'+p.fim;if(cacheTela[k]&&!forcar){renderModulo(m,cacheTela[k]);return}loading('Carregando '+titulos[m]+'...');google.script.run.withSuccessHandler(d=>{cacheTela[k]=d;renderModulo(m,d)}).withFailureHandler(erro).obterModuloPortalV12(m,p.inicio,p.fim,!!forcar)}
function renderModulo(m,d){mensagemErro.classList.add('oculto');if(m==='indicadores'){renderIndicadores(d);return}if(['prioridades','vencidos','pendencias'].includes(m)){renderAgrupado(m,d);return}dadosModulo=Array.isArray(d)?d:[];renderTabela(m,dadosModulo)}
function renderAgrupado(m,d){d=d||{};dadosModulo=(d.todos||[]);let html='<div class="painel"><div class="cabecalho-modulo"><div><h2>'+titulos[m]+'</h2><small>Listagens separadas por situação funcional</small></div></div>'+secaoGrupo(m,'Ativos e férias',d.ativosFerias||[])+secaoGrupo(m,'Outros status',d.outrosStatus||[])+'</div>';areaPrincipal.innerHTML=html}
function secaoGrupo(m,t,l){return'<div class="secao"><h3><span>'+t+'</span><span class="contador">'+l.length+'</span></h3>'+(l.length?montarTabela(m,l,false):'<div class="vazio">Nenhum registro.</div>')+'</div>'}
function renderTabela(m,l){dadosModulo=l;let extra='';if(m==='exames')extra='<button class="btn azul" onclick="exportarCSV()">Exportar listagem</button>';if(m==='convocar')extra='<div class="campo"><label>E-mail do gestor</label><input id="emailGestor" placeholder="gestor@isgh.org.br"></div><button class="btn azul" onclick="enviarSelecionadas()">Enviar selecionadas</button><button class="btn sec" onclick="gerarSelecionadas()">Gerar PDFs selecionados</button>';areaPrincipal.innerHTML='<div class="painel"><div class="cabecalho-modulo"><div><h2>'+titulos[m]+'</h2><small><span id="contador">'+l.length+'</span> registros encontrados</small></div><div class="acoes">'+extra+'</div></div>'+montarTabela(m,l,m==='convocar')+'<div class="rodape">Período: '+br(dataInicio.value)+' a '+br(dataFim.value)+'</div></div>'}
function montarTabela(m,l,check){const cols=colunas(m),cab=(check?'<th><input class="check" type="checkbox" onclick="selecionarVisiveis(this)"></th>':'')+cols.map(c=>'<th>'+c.t+'</th>').join('');const linhas=l.map(r=>'<tr data-search="'+esc(JSON.stringify(r).toLowerCase())+'" data-mat="'+esc(r.mat)+'">'+(check?'<td><input class="check check-item" type="checkbox" '+(selecionadas.has(String(r.mat))?'checked':'')+' onchange="marcar(this,\''+esc(r.mat)+'\')"></td>':'')+cols.map(c=>'<td>'+celula(r,c.k)+'</td>').join('')+'</tr>').join('');return'<div class="tabela-wrap"><table><thead><tr>'+cab+'</tr></thead><tbody id="corpoTabela">'+linhas+'</tbody></table></div>'}
function colunas(m){const base=[{k:'mat',t:'Matrícula'},{k:'nome',t:'Nome'},{k:'funcao',t:'Função'},{k:'setor',t:'Setor'},{k:'situacao',t:'Situação'}];if(m==='exames')return[{k:'prioridadeComplementar',t:'Prioridade'},...base,{k:'grupoComplementar',t:'Grupo'},{k:'dataConvocarBR',t:'Convocar'},{k:'dataLimiteBR',t:'Limite'},{k:'proximoVencimentoBR',t:'Vencimento'},{k:'dataAgendadaBR',t:'Agendado'},{k:'statusAgenda',t:'Status'},{k:'alertaComplementar',t:'Orientação'}];if(m==='convocar')return[...base,{k:'dataConvocarBR',t:'Convocar'},{k:'dataLimiteBR',t:'Limite'},{k:'dataAgendadaBR',t:'Agendada'},{k:'statusAgenda',t:'Status'},{k:'diasParaVencer',t:'Dias'},{k:'prioridade',t:'Prioridade'},{k:'acaoPdf',t:'PDF'}];if(m==='consulta')return[...base,{k:'dataUltimoAsoBR',t:'Último ASO'},{k:'proximoVencimentoBR',t:'Vencimento'},{k:'diasStatusAso',t:'Dias'},{k:'statusAso',t:'Status ASO'}];return[...base,{k:'dataAgendadaBR',t:'Agendada'},{k:'statusAgenda',t:'Status agenda'},{k:'proximoVencimentoBR',t:'Vencimento'},{k:'diasParaVencer',t:'Dias'},{k:'prioridade',t:'Prioridade'}]}
function celula(r,k){let v=r[k]??'';if(k==='acaoPdf')return'<button class="btn pequeno" onclick="gerarPdf(\''+esc(r.mat)+'\')">PDF</button>';if(k.toLowerCase().includes('prioridade')||k==='statusAso'||k==='statusAgenda')return'<span class="badge '+classeBadge(v)+'">'+esc(v||'Pendente')+'</span>';return esc(v)}
function classeBadge(v){v=String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(v.includes('critic')||v.includes('vencid')||v.includes('atras'))return'critico';if(v.includes('urgent')||v.includes('alta'))return'urgente';if(v.includes('atenc')||v.includes('media')||v.includes('prior'))return'atencao';return'programado'}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function br(v){return v?v.split('-').reverse().join('/'):''}
function aplicarPesquisa(){const q=pesquisa.value.trim().toLowerCase();let n=0;document.querySelectorAll('tbody tr[data-search]').forEach(tr=>{const ok=!q||tr.dataset.search.includes(q);tr.style.display=ok?'':'none';if(ok)n++});const c=document.getElementById('contador');if(c)c.textContent=n}
function marcar(el,mat){el.checked?selecionadas.add(String(mat)):selecionadas.delete(String(mat))}
function selecionarVisiveis(el){document.querySelectorAll('#corpoTabela tr').forEach(tr=>{if(tr.style.display==='none')return;const c=tr.querySelector('.check-item');if(c){c.checked=el.checked;marcar(c,tr.dataset.mat)}})}
function exigirSelecao(){const mats=Array.from(selecionadas);if(!mats.length){alert('Selecione pelo menos uma convocação.');return null}return mats}
function gerarPdf(mat){google.script.run.withSuccessHandler(r=>{if(r&&r.url)window.open(r.url,'_blank')}).withFailureHandler(erro).gerarConvocacaoIndividual(mat)}
function gerarSelecionadas(){const mats=exigirSelecao();if(!mats)return;const p=periodo();loading('Gerando PDFs selecionados...');google.script.run.withSuccessHandler(r=>{alert('Processamento concluído: '+(r||[]).length+' registro(s).');carregarModulo('convocar',true)}).withFailureHandler(erro).gerarConvocacoesSelecionadasLote(mats,p.inicio,p.fim)}
function enviarSelecionadas(){const mats=exigirSelecao();if(!mats)return;const email=(document.getElementById('emailGestor')?.value||'').trim();if(!email){alert('Informe o e-mail do gestor.');return}if(!confirm('Enviar '+mats.length+' convocação(ões) para '+email+'?'))return;const lotes=[];for(let i=0;i<mats.length;i+=10)lotes.push(mats.slice(i,i+10));enviarLoteEmail(lotes,email,0,0)}
function enviarLoteEmail(lotes,email,idx,total){if(idx>=lotes.length){alert('Envio concluído. Convocações processadas: '+total);selecionadas.clear();carregarModulo('convocar',true);return}loading('Enviando lote '+(idx+1)+' de '+lotes.length+'...');const p=periodo();google.script.run.withSuccessHandler(r=>enviarLoteEmail(lotes,email,idx+1,total+(r||[]).filter(x=>x.sucesso).length)).withFailureHandler(erro).enviarConvocacoesSelecionadasGestor(lotes[idx],email,p.inicio,p.fim,{})}
function exportarCSV(){const cols=colunas('exames'),ls=[cols.map(c=>c.t)];dadosModulo.forEach(r=>ls.push(cols.map(c=>String(r[c.k]??'').replace(/;/g,','))));const b=new Blob(['\ufeff'+ls.map(x=>x.join(';')).join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='exames_complementares_'+dataInicio.value+'_'+dataFim.value+'.csv';a.click();URL.revokeObjectURL(a.href)}
function renderIndicadores(d){areaPrincipal.innerHTML='<div class="painel"><div class="cabecalho-modulo"><div><h2>Indicadores</h2><small>Carregado sob demanda</small></div></div><pre style="white-space:pre-wrap;font-size:12px;background:#f8fafc;padding:14px;border-radius:10px;overflow:auto">'+esc(JSON.stringify(d,null,2))+'</pre></div>'}
</script>
</body>
</html>
