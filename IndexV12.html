<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--nav:#0f172a;--nav2:#1e293b;--primary:#0f766e;--accent:#2563eb;--bg:#f4f7fb;--card:#fff;--border:#dce4ee;--text:#172033;--muted:#64748b;--danger:#b91c1c;--warning:#b45309;--success:#047857}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    .app{display:flex;min-height:100vh}.sidebar{width:250px;background:linear-gradient(180deg,var(--nav),var(--nav2));color:#fff;position:fixed;inset:0 auto 0 0;transition:.25s;z-index:30;overflow:auto}.sidebar.recolhida{width:76px}
    .brand{padding:22px 18px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;gap:12px;align-items:center}.logo{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--primary);display:grid;place-items:center;font-weight:800}.brand-texto strong{display:block;font-size:16px}.brand-texto span{font-size:12px;color:#cbd5e1}.sidebar.recolhida .brand-texto,.sidebar.recolhida .nav-texto{display:none}
    .nav{padding:14px 10px}.nav button{width:100%;border:0;background:transparent;color:#dbeafe;padding:12px;border-radius:10px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center;margin-bottom:5px;font-size:13px}.nav button:hover,.nav button.ativo{background:rgba(255,255,255,.12);color:#fff}.icone{width:26px;text-align:center;font-size:17px}
    .principal{margin-left:250px;width:calc(100% - 250px);transition:.25s}.principal.expandida{margin-left:76px;width:calc(100% - 76px)}
    .topbar{height:72px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.topbar h1{margin:0;font-size:20px}.topbar p{margin:4px 0 0;color:var(--muted);font-size:12px}.toggle{border:0;background:#eef2f7;border-radius:9px;padding:9px 12px;cursor:pointer;font-size:18px}
    .conteudo{padding:22px}.painel{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 5px 18px rgba(15,23,42,.05);padding:18px;margin-bottom:16px}
    .filtros{display:grid;grid-template-columns:180px 180px minmax(220px,1fr) auto auto;gap:10px;align-items:end}.campo label{display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:5px}.campo input,.campo select{width:100%;height:38px;border:1px solid #cbd5e1;border-radius:9px;padding:0 10px;background:#fff}
    .btn{height:38px;border:0;border-radius:9px;padding:0 14px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff}.btn.sec{background:#475569}.btn.azul{background:var(--accent)}.btn.pequeno{height:30px;padding:0 9px;font-size:11px}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#fff;border:1px solid var(--border);border-radius:13px;padding:15px;box-shadow:0 3px 12px rgba(15,23,42,.04)}.card span{font-size:11px;color:var(--muted);font-weight:700}.card strong{display:block;font-size:27px;margin-top:8px;color:var(--primary)}
    .cabecalho-modulo{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.cabecalho-modulo h2{margin:0;font-size:18px}.cabecalho-modulo small{color:var(--muted)}
    .tabela-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;max-height:65vh}table{width:100%;border-collapse:collapse;min-width:1050px;font-size:11px}th{position:sticky;top:0;background:#eef3f8;color:#334155;text-transform:uppercase;font-size:9px;letter-spacing:.03em;z-index:2}th,td{padding:8px 7px;border-bottom:1px solid #e5eaf0;text-align:left;vertical-align:middle}tr:hover td{background:#f8fafc}
    .badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:800;background:#dbeafe;color:#1e40af}.badge.critico,.badge.vencido{background:#fee2e2;color:#991b1b}.badge.urgente,.badge.alta{background:#ffedd5;color:#9a3412}.badge.atencao,.badge.media{background:#fef3c7;color:#92400e}.badge.programado,.badge.baixa{background:#dcfce7;color:#166534}
    .loading,.erro,.vazio{padding:20px;text-align:center;color:var(--muted)}.erro{color:var(--danger);background:#fef2f2;border-radius:10px}.oculto{display:none!important}.acoes{display:flex;gap:6px}.rodape{margin-top:10px;color:var(--muted);font-size:11px}
    @media(max-width:900px){.sidebar{width:76px}.brand-texto,.nav-texto{display:none}.principal{margin-left:76px;width:calc(100% - 76px)}.filtros{grid-template-columns:1fr 1fr}.conteudo{padding:12px}.topbar{padding:0 14px}}
  </style>
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><div class="logo">S</div><div class="brand-texto"><strong>SESMT HRC</strong><span>Painel de ASOs</span></div></div>
    <nav class="nav">
      <button class="ativo" data-modulo="dashboard" onclick="abrirModulo('dashboard',this)"><span class="icone">▦</span><span class="nav-texto">Visão Geral</span></button>
      <button data-modulo="convocar" onclick="abrirModulo('convocar',this)"><span class="icone">✉</span><span class="nav-texto">Convocar</span></button>
      <button data-modulo="exames" onclick="abrirModulo('exames',this)"><span class="icone">⌁</span><span class="nav-texto">Exames Complementares</span></button>
      <button data-modulo="prioridades" onclick="abrirModulo('prioridades',this)"><span class="icone">!</span><span class="nav-texto">Prioridades</span></button>
      <button data-modulo="vencidos" onclick="abrirModulo('vencidos',this)"><span class="icone">⚠</span><span class="nav-texto">Vencidos</span></button>
      <button data-modulo="pendencias" onclick="abrirModulo('pendencias',this)"><span class="icone">↻</span><span class="nav-texto">Pendências</span></button>
      <button data-modulo="consulta" onclick="abrirModulo('consulta',this)"><span class="icone">⌕</span><span class="nav-texto">Consulta de ASO</span></button>
      <button data-modulo="indicadores" onclick="abrirModulo('indicadores',this)"><span class="icone">▥</span><span class="nav-texto">Indicadores</span></button>
    </nav>
  </aside>
  <main id="principal" class="principal">
    <header class="topbar"><div style="display:flex;align-items:center;gap:13px"><button class="toggle" onclick="alternarMenu()">☰</button><div><h1>PAINEL DE ASOS SESMT HRC</h1><p id="subtitulo">Gestão de saúde ocupacional e acompanhamento de vencimentos</p></div></div><div id="statusAtualizacao" style="font-size:11px;color:#64748b"></div></header>
    <section class="conteudo">
      <div class="painel filtros">
        <div class="campo"><label>Data inicial</label><input type="date" id="dataInicio"></div>
        <div class="campo"><label>Data final</label><input type="date" id="dataFim"></div>
        <div class="campo"><label>Pesquisar na listagem</label><input id="pesquisa" placeholder="Nome, matrícula, função ou setor" oninput="aplicarPesquisa()"></div>
        <button class="btn" onclick="atualizarPeriodo(false)">Filtrar</button>
        <button class="btn sec" onclick="atualizarPeriodo(true)">Atualizar</button>
      </div>
      <div id="mensagemErro" class="erro oculto"></div>
      <div id="areaPrincipal"></div>
    </section>
  </main>
</div>
<script>
  let moduloAtual='dashboard', dadosModulo=[], cacheTela={};
  const titulos={dashboard:'Visão Geral',convocar:'Convocar colaboradores',exames:'Exames Complementares',prioridades:'Prioridades',vencidos:'ASOs vencidos',pendencias:'Pendências de comparecimento',consulta:'Consulta de ASO',indicadores:'Indicadores'};

  document.addEventListener('DOMContentLoaded',()=>{definirPeriodoPadrao();carregarResumo(false)});
  function definirPeriodoPadrao(){const h=new Date(),i=new Date(h.getFullYear(),h.getMonth(),1),f=new Date(h.getFullYear(),h.getMonth()+1,0);dataInicio.value=iso(i);dataFim.value=iso(f)}
  function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function alternarMenu(){sidebar.classList.toggle('recolhida');principal.classList.toggle('expandida')}
  function periodo(){return {inicio:dataInicio.value,fim:dataFim.value}}
  function atualizarPeriodo(forcar){cacheTela={};pesquisa.value='';moduloAtual==='dashboard'?carregarResumo(forcar):carregarModulo(moduloAtual,forcar)}
  function abrirModulo(modulo,el){moduloAtual=modulo;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('ativo'));if(el)el.classList.add('ativo');subtitulo.textContent=titulos[modulo];pesquisa.value='';modulo==='dashboard'?carregarResumo(false):carregarModulo(modulo,false)}
  function mostrarCarregando(txt){areaPrincipal.innerHTML='<div class="painel loading">'+(txt||'Carregando dados...')+'</div>';ocultarErro()}
  function erro(e){mensagemErro.textContent=e&&e.message?e.message:String(e);mensagemErro.classList.remove('oculto');areaPrincipal.innerHTML=''}
  function ocultarErro(){mensagemErro.classList.add('oculto')}

  function carregarResumo(forcar){mostrarCarregando('Carregando visão geral...');const p=periodo();google.script.run.withSuccessHandler(renderResumo).withFailureHandler(erro).obterResumoPortalV12(p.inicio,p.fim,!!forcar)}
  function renderResumo(r){statusAtualizacao.textContent='Atualizado em '+r.meta.geradoEm;const d=r.dashboard;areaPrincipal.innerHTML='<div class="cards">'+card('Colaboradores',d.totalColaboradores)+card('Para convocar',d.totalConvocar)+card('Agendados no período',d.totalAgendados)+card('ASOs realizados',d.totalRealizados)+card('Pendências',d.totalPendencias,'warning')+card('Prioridade ≤ 30 dias',d.totalPrioridade,'warning')+card('Vencidos',d.totalVencidos,'danger')+card('Exames complementares',d.totalExamesComplementares)+card('Exames sem ASO agendado',d.examesSemAgendamentoAso,'warning')+'</div><div class="painel" style="margin-top:16px"><div class="cabecalho-modulo"><div><h2>Resumo operacional</h2><small>Use o menu lateral para abrir somente o módulo necessário.</small></div></div><p style="color:#64748b;font-size:13px">O carregamento agora é modular. As tabelas extensas e os indicadores só são consultados quando a respectiva opção é aberta.</p></div>'}
  function card(t,n,classe){return '<div class="card"><span>'+t+'</span><strong style="'+(classe==='danger'?'color:#b91c1c':classe==='warning'?'color:#b45309':'')+'">'+(n||0)+'</strong></div>'}

  function carregarModulo(modulo,forcar){const p=periodo(),chave=modulo+'_'+p.inicio+'_'+p.fim;if(cacheTela[chave]&&!forcar){renderModulo(modulo,cacheTela[chave]);return}mostrarCarregando('Carregando '+titulos[modulo]+'...');google.script.run.withSuccessHandler(d=>{cacheTela[chave]=d;renderModulo(modulo,d)}).withFailureHandler(erro).obterModuloPortalV12(modulo,p.inicio,p.fim,!!forcar)}
  function renderModulo(modulo,d){ocultarErro();if(modulo==='pendencias'){dadosModulo=(d&&d.operacionais)||[]}else{dadosModulo=Array.isArray(d)?d:[]}if(modulo==='indicadores'){renderIndicadores(d);return}renderTabela(modulo,dadosModulo)}
  function renderTabela(modulo,lista){const cols=colunas(modulo);let extra=modulo==='exames'?'<button class="btn azul" onclick="exportarCSV()">Exportar listagem</button>':modulo==='convocar'?'<button class="btn azul" onclick="gerarLote()">Gerar PDFs do período</button>':'';let html='<div class="painel"><div class="cabecalho-modulo"><div><h2>'+titulos[modulo]+'</h2><small><span id="contador">'+lista.length+'</span> registros encontrados</small></div><div class="acoes">'+extra+'</div></div><div class="tabela-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+c.t+'</th>').join('')+'</tr></thead><tbody id="corpoTabela">'+linhas(lista,cols,modulo)+'</tbody></table></div><div class="rodape">Período selecionado: '+dataInicio.value.split('-').reverse().join('/')+' a '+dataFim.value.split('-').reverse().join('/')+'</div></div>';areaPrincipal.innerHTML=html}
  function colunas(m){const base=[{k:'mat',t:'Matrícula'},{k:'nome',t:'Nome'},{k:'funcao',t:'Função'},{k:'setor',t:'Setor'},{k:'situacao',t:'Situação'}];if(m==='exames')return [{k:'prioridadeComplementar',t:'Prioridade'},{k:'mat',t:'Matrícula'},{k:'nome',t:'Nome'},{k:'funcao',t:'Função'},{k:'setor',t:'Setor'},{k:'grupoComplementar',t:'Grupo'},{k:'proximoVencimentoBR',t:'Vencimento'},{k:'dataConvocarBR',t:'Convocar'},{k:'dataLimiteBR',t:'Data limite'},{k:'dataAgendadaBR',t:'ASO agendado'},{k:'statusAgenda',t:'Status agenda'},{k:'alertaComplementar',t:'Orientação'}];if(m==='convocar')return base.concat([{k:'proximoVencimentoBR',t:'Vencimento'},{k:'dataLimiteBR',t:'Data limite'},{k:'dataAgendadaBR',t:'Agendamento'},{k:'statusAgenda',t:'Status'},{k:'acaoPdf',t:'Ação'}]);if(m==='prioridades'||m==='vencidos')return base.concat([{k:'proximoVencimentoBR',t:'Vencimento'},{k:'dataLimiteBR',t:'Data limite'},{k:'diasParaVencer',t:'Dias'},{k:'prioridade',t:'Prioridade'},{k:'dataAgendadaBR',t:'Agendamento'}]);if(m==='pendencias')return base.concat([{k:'dataUltimaPendenciaBR',t:'Última pendência'},{k:'statusPendencia',t:'Status'},{k:'qtdOcorrencias',t:'Ocorrências'},{k:'novaDataAgendadaBR',t:'Nova data'},{k:'acaoPendencia',t:'Ação necessária'}]);return base.concat([{k:'dataUltimoAsoBR',t:'Último ASO'},{k:'proximoVencimentoBR',t:'Próximo vencimento'},{k:'dataAgendadaBR',t:'Agendamento'},{k:'statusAso',t:'Status ASO'}])}
  function linhas(lista,cols,modulo){if(!lista.length)return '<tr><td colspan="'+cols.length+'"><div class="vazio">Nenhum registro encontrado.</div></td></tr>';return lista.map((r,i)=>'<tr data-search="'+esc([r.mat,r.nome,r.funcao,r.setor,r.situacao,r.grupoComplementar,r.statusAgenda].join(' ').toLowerCase())+'">'+cols.map(c=>'<td>'+celula(r,c.k,modulo,i)+'</td>').join('')+'</tr>').join('')}
  function celula(r,k,m,i){let v=r[k]??'';if(k==='acaoPdf')return '<button class="btn pequeno" onclick="gerarPdf(\''+esc(r.mat)+'\')">PDF</button>';if(k.toLowerCase().includes('prioridade'))return '<span class="badge '+classeBadge(v)+'">'+esc(v)+'</span>';if(k==='statusAso'||k==='statusAgenda'||k==='statusPendencia')return '<span class="badge '+classeBadge(v)+'">'+esc(v||'Pendente')+'</span>';return esc(v)}
  function classeBadge(v){v=String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(v.includes('critic')||v.includes('vencid')||v.includes('atras'))return 'critico';if(v.includes('urgent')||v.includes('alta'))return 'urgente';if(v.includes('atenc')||v.includes('media')||v.includes('prior'))return 'atencao';return 'programado'}
  function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function aplicarPesquisa(){const q=pesquisa.value.trim().toLowerCase();let n=0;document.querySelectorAll('#corpoTabela tr[data-search]').forEach(tr=>{const ok=!q||tr.dataset.search.includes(q);tr.style.display=ok?'':'none';if(ok)n++});const c=document.getElementById('contador');if(c)c.textContent=n}
  function gerarPdf(mat){google.script.run.withSuccessHandler(r=>{if(r&&r.url)window.open(r.url,'_blank')}).withFailureHandler(erro).gerarConvocacaoIndividual(mat)}
  function gerarLote(){const p=periodo();if(!confirm('Gerar os PDFs dos ASOs agendados no período selecionado?'))return;mostrarCarregando('Gerando PDFs...');google.script.run.withSuccessHandler(r=>{alert('Processamento concluído. Registros: '+(r||[]).length);carregarModulo('convocar',true)}).withFailureHandler(erro).gerarConvocacoesPeriodo(p.inicio,p.fim)}
  function exportarCSV(){const cols=colunas('exames'),linhasCsv=[cols.map(c=>c.t)];dadosModulo.forEach(r=>linhasCsv.push(cols.map(c=>String(r[c.k]??'').replace(/;/g,','))));const blob=new Blob(['\ufeff'+linhasCsv.map(l=>l.join(';')).join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='exames_complementares_'+dataInicio.value+'_'+dataFim.value+'.csv';a.click();URL.revokeObjectURL(a.href)}
  function renderIndicadores(d){areaPrincipal.innerHTML='<div class="painel"><div class="cabecalho-modulo"><div><h2>Indicadores</h2><small>Módulo carregado sob demanda</small></div></div><pre style="white-space:pre-wrap;font-size:12px;background:#f8fafc;padding:14px;border-radius:10px;overflow:auto">'+esc(JSON.stringify(d,null,2))+'</pre></div>'}
</script>
</body>
</html>
