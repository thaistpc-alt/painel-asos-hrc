<script>
(function(){
  const FIXAS=['ATIVO','FERIAS'];
  let selecionadas=new Set(FIXAS),selecionadasComplementares=new Set(FIXAS),tokenGeral=0;
  const norm=v=>String(v||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

  function removerLimparAntigo(){document.querySelectorAll('.filtros>button,#toolbarModulo>button,.linha-filtros>button').forEach(b=>{if(b.textContent.trim().toLowerCase()==='limpar'&&!b.classList.contains('painel-limpar-periodo'))b.remove();});}
  function moverPeriodo(){const top=document.querySelector('.painel-topbar'),atualizar=top&&top.querySelector('.painel-atualizar'),filtros=document.querySelector('.filtros'),inicio=document.getElementById('dataInicio'),fim=document.getElementById('dataFim');if(!top||!atualizar||!filtros||!inicio||!fim)return;removerLimparAntigo();if(top.querySelector('.painel-topbar-periodo'))return;const bloco=document.createElement('div');bloco.className='painel-topbar-acoes';const periodo=document.createElement('div');periodo.className='painel-topbar-periodo';periodo.appendChild(inicio.closest('div'));periodo.appendChild(fim.closest('div'));const filtrar=[...filtros.querySelectorAll('button')].find(b=>b.textContent.trim().toLowerCase()==='filtrar');if(filtrar)periodo.appendChild(filtrar);const limpar=document.createElement('button');limpar.type='button';limpar.className='painel-limpar-periodo';limpar.textContent='Limpar';limpar.onclick=function(){const h=new Date(),ini=new Date(h.getFullYear(),h.getMonth(),1),fm=new Date(h.getFullYear(),h.getMonth()+1,0);inicio.value=formatarDataInput(ini);fim.value=formatarDataInput(fm);resetarSituacoes();resetarSituacoesComplementares();document.querySelectorAll('.linha-filtros input[type="text"],.linha-filtros input[type="email"]').forEach(el=>el.value='');document.querySelectorAll('.linha-filtros select').forEach(el=>el.value='');carregarDados(false)};periodo.appendChild(limpar);bloco.appendChild(periodo);bloco.appendChild(atualizar);top.appendChild(bloco);}

  function situacoesDisponiveis(){const lista=dadosPortal&&dadosPortal.convocar&&dadosPortal.convocar.todos||[];return[...new Set(lista.map(i=>i.situacao).filter(Boolean))].sort((a,b)=>a.localeCompare(b));}
  function atualizarResumoSituacoes(){const b=document.querySelector('.situacao-multipla:not(.situacao-complementares) .situacao-multipla-botao');if(!b)return;const nomes=situacoesDisponiveis().filter(s=>selecionadas.has(norm(s)));b.textContent=nomes.length<=2?nomes.join(', '):nomes.slice(0,2).join(', ')+' +'+(nomes.length-2);}
  function aplicarSituacoes(){if(!dadosPortal||!dadosPortal.convocar)return;const termo=obterTermoPesquisa('pesquisaConvocar');renderizarConvocar((dadosPortal.convocar.todos||[]).filter(i=>selecionadas.has(norm(i.situacao))&&correspondePesquisa(i,termo)));ajustarConvocar();quebrarCabecalhos();}
  function resetarSituacoes(){selecionadas=new Set(FIXAS);document.querySelectorAll('.situacao-multipla:not(.situacao-complementares) .situacao-multipla-lista input').forEach(cb=>cb.checked=FIXAS.includes(cb.dataset.normalizada));atualizarResumoSituacoes();aplicarSituacoes();}
  function montarFiltroSituacao(){const select=document.getElementById('filtroSituacaoConvocar');if(!select)return;const existente=document.querySelector('.situacao-multipla:not(.situacao-complementares)');if(existente){atualizarResumoSituacoes();return}const pai=select.closest('div');if(!pai)return;const controle=document.createElement('div');controle.className='situacao-multipla';controle.innerHTML='<button type="button" class="situacao-multipla-botao">Ativo, Férias</button><div class="situacao-multipla-lista"></div>';pai.appendChild(controle);const lista=controle.querySelector('.situacao-multipla-lista');situacoesDisponiveis().forEach(s=>{const n=norm(s),fixa=FIXAS.includes(n),label=document.createElement('label');label.className='situacao-opcao'+(fixa?' fixa':'');label.innerHTML='<input type="checkbox" data-normalizada="'+n.replace(/"/g,'&quot;')+'" '+(fixa?'checked disabled':'')+'><span></span>';label.querySelector('span').textContent=s;const cb=label.querySelector('input');cb.onchange=()=>{cb.checked?selecionadas.add(n):selecionadas.delete(n);atualizarResumoSituacoes();aplicarSituacoes()};lista.appendChild(label)});controle.querySelector('.situacao-multipla-botao').onclick=()=>controle.classList.toggle('aberta');atualizarResumoSituacoes();}

  function situacoesComplementaresDisponiveis(){const lista=dadosPortal&&dadosPortal.examesComplementares||[];return[...new Set(lista.map(i=>i.situacao).filter(Boolean))].sort((a,b)=>a.localeCompare(b));}
  function atualizarResumoComplementares(){const b=document.querySelector('.situacao-complementares .situacao-multipla-botao');if(!b)return;const nomes=situacoesComplementaresDisponiveis().filter(s=>selecionadasComplementares.has(norm(s)));b.textContent=nomes.length<=2?nomes.join(', '):nomes.slice(0,2).join(', ')+' +'+(nomes.length-2);}
  function resetarSituacoesComplementares(){selecionadasComplementares=new Set(FIXAS);document.querySelectorAll('.situacao-complementares input').forEach(cb=>cb.checked=FIXAS.includes(cb.dataset.normalizada));atualizarResumoComplementares();if(dadosPortal&&dadosPortal.examesComplementares)filtrarComplementaresAjustado();}
  function montarFiltroSituacaoComplementares(){const linha=document.querySelector('#complementares .linha-filtros');if(!linha||linha.querySelector('.situacao-complementares'))return;const bloco=document.createElement('div');bloco.className='situacao-multipla situacao-complementares';bloco.innerHTML='<label>Situação</label><button type="button" class="situacao-multipla-botao">Ativo, Férias</button><div class="situacao-multipla-lista"></div>';const grupo=document.getElementById('filtroGrupoComplementar');const grupoBloco=grupo&&grupo.closest('div');linha.insertBefore(bloco,grupoBloco||linha.firstChild);const lista=bloco.querySelector('.situacao-multipla-lista');situacoesComplementaresDisponiveis().forEach(s=>{const n=norm(s),fixa=FIXAS.includes(n),label=document.createElement('label');label.className='situacao-opcao'+(fixa?' fixa':'');label.innerHTML='<input type="checkbox" data-normalizada="'+n.replace(/"/g,'&quot;')+'" '+(fixa?'checked disabled':'')+'><span></span>';label.querySelector('span').textContent=s;const cb=label.querySelector('input');cb.onchange=()=>{cb.checked?selecionadasComplementares.add(n):selecionadasComplementares.delete(n);atualizarResumoComplementares();filtrarComplementaresAjustado()};lista.appendChild(label)});bloco.querySelector('.situacao-multipla-botao').onclick=()=>bloco.classList.toggle('aberta');atualizarResumoComplementares();}
  function filtrarComplementaresAjustado(){if(!dadosPortal)return;const grupo=document.getElementById('filtroGrupoComplementar')?.value||'',termo=obterTermoPesquisa('pesquisaComplementares');const lista=(dadosPortal.examesComplementares||[]).filter(i=>selecionadasComplementares.has(norm(i.situacao))&&(!grupo||i.grupoComplementar===grupo)&&(!termo||correspondePesquisaComplementar(i,termo)));renderizarComplementares(lista);}

  function ajustarConvocar(){const th=[...document.querySelectorAll('#tabelaConvocar thead th')].find(c=>norm(c.textContent)==='MATRICULA');if(th){th.textContent='MAT';th.dataset.quebrado='1';}}
  function quebrarCabecalhos(){const mapa={'DATA CONVOCAR':'Data<br>convocar','DATA LIMITE':'Data<br>limite','DATA AGENDADA':'Data<br>agendada','STATUS AGENDA':'Status<br>agenda','ULTIMA PENDENCIA':'Última<br>pendência','NOVA DATA':'Nova<br>data','PROX. VENC.':'Próx.<br>venc.','DATA LIMITE PARA REALIZAR':'Data limite<br>para realizar','DATA REALIZADA':'Data<br>realizada','VENCIMENTO AVALIADO':'Vencimento<br>avaliado','MES ANALISADO':'Mês<br>analisado'};document.querySelectorAll('.conteudo table thead th').forEach(th=>{if(th.querySelector('input'))return;const k=norm(th.textContent).replace(/\s+/g,' ');if(mapa[k]&&th.dataset.quebrado!=='1'){th.innerHTML=mapa[k];th.dataset.quebrado='1'}});ajustarConvocar();}

  function carregarGeralSeguro(){const inicio=document.getElementById('dataInicio')?.value||'',fim=document.getElementById('dataFim')?.value||'';if(!inicio||!fim)return;const meuToken=++tokenGeral,div=document.getElementById('tabelaColaboradores');if(div)div.innerHTML='<div class="vazio">Carregando colaboradores...</div>';google.script.run.withSuccessHandler(r=>{if(meuToken!==tokenGeral)return;const ai=document.getElementById('dataInicio')?.value||'',af=document.getElementById('dataFim')?.value||'';if(ai!==inicio||af!==fim)return;dadosPortal=Object.assign(dadosPortal||{},r||{});filtrarColaboradores();quebrarCabecalhos()}).withFailureHandler(e=>{if(meuToken===tokenGeral&&div)div.innerHTML='<div class="vazio">Erro ao carregar colaboradores: '+escaparHtml(e.message||e)+'</div>'}).obterModuloPortalV13('COLABORADORES',inicio,fim,false);}

  window.carregarFiltroSituacao=function(){montarFiltroSituacao();atualizarResumoSituacoes()};window.filtrarConvocacaoPorSituacao=aplicarSituacoes;window.filtrarComplementares=filtrarComplementaresAjustado;
  const limparOriginal=window.limparFiltrosLocais;window.limparFiltrosLocais=function(){if(typeof limparOriginal==='function')limparOriginal();resetarSituacoes();resetarSituacoesComplementares()};
  const abrirOriginal=window.abrirAba;window.abrirAba=function(id,botao){abrirOriginal(id,botao);removerLimparAntigo();setTimeout(()=>{montarFiltroSituacao();if(id==='complementares'){montarFiltroSituacaoComplementares();filtrarComplementaresAjustado()}quebrarCabecalhos();ajustarIndicadores()},0)};

  const renderComplementaresOriginal=window.renderizarComplementares;window.renderizarComplementares=function(lista){if(typeof renderComplementaresOriginal==='function')renderComplementaresOriginal(lista);const cards=document.getElementById('cardsComplementares');if(cards)cards.innerHTML='';const tabela=document.querySelector('#tabelaComplementares table');if(tabela&&!tabela.querySelector('th[data-situacao]')){tabela.querySelectorAll('tr').forEach((tr,idx)=>{const cel=document.createElement(idx===0?'th':'td');if(idx===0){cel.textContent='Situação';cel.dataset.situacao='1';tr.insertBefore(cel,tr.children[5]||null)}else{const item=(lista||[])[idx-1];cel.textContent=item&&item.situacao||'';tr.insertBefore(cel,tr.children[5]||null)}})}quebrarCabecalhos()};

  function ajustarIndicadores(){const grafico=document.getElementById('graficoMetaMensal');if(grafico){const titulo=grafico.previousElementSibling;if(titulo&&norm(titulo.textContent)==='DESEMPENHO MENSAL DA META')titulo.remove();grafico.remove()}document.querySelectorAll('#analiseIndicadorMensal .analise-bloco h3 span:first-child').forEach(s=>{if(norm(s.textContent).includes('ASOS ATRASADOS REALIZADOS NO MES DA ANALISE'))s.textContent='Atrasados no vencimento — relação nominal'});quebrarCabecalhos()}
  const renderIndicadoresOriginal=window.renderizarIndicadores;window.renderizarIndicadores=function(ind){if(typeof renderIndicadoresOriginal==='function')renderIndicadoresOriginal(ind);ajustarIndicadores()};
  function iniciar(){moverPeriodo();removerLimparAntigo();montarFiltroSituacao();quebrarCabecalhos();ajustarIndicadores()}
  document.addEventListener('DOMContentLoaded',()=>{setTimeout(iniciar,0);setTimeout(iniciar,300)});
})();
</script>

<style>
/* Dropdown de Situação em camada fixa, sem alterar a altura da barra de filtros. */
.filtro-situacao-check-lista{
  position:fixed!important;
  top:auto!important;
  left:auto!important;
  z-index:30000!important;
  max-height:min(300px,calc(100vh - 24px))!important;
  overflow-x:hidden!important;
  overflow-y:auto!important;
}
.filtros,.filtros #toolbarModulo,.filtros .linha-filtros{
  overflow-y:visible!important;
}

<script>
(function(){
  'use strict';

  function posicionarListaSituacao(botao){
    const bloco=botao&&botao.closest('.filtro-situacao-check');
    const lista=bloco&&bloco.querySelector('.filtro-situacao-check-lista');
    if(!bloco||!lista)return;

    const r=botao.getBoundingClientRect();
    const largura=Math.max(280,Math.round(r.width));
    const margem=8;
    let esquerda=r.left;
    if(esquerda+largura>window.innerWidth-margem){
      esquerda=Math.max(margem,window.innerWidth-largura-margem);
    }

    lista.style.width=largura+'px';
    lista.style.left=Math.round(esquerda)+'px';
    lista.style.top=Math.round(r.bottom+6)+'px';
  }

<script>
(function () {
  'use strict';

  const FIXAS = ['ATIVO', 'FERIAS'];
  const estado = {
    convocar: new Set(FIXAS),
    complementares: new Set(FIXAS)
  };

  function portalAtual() {
    return typeof dadosPortal !== 'undefined' && dadosPortal ? dadosPortal : null;
  }

  function processamentoAtivo() {
    return typeof loteEmProcessamento !== 'undefined' && loteEmProcessamento === true;
  }

  function definirProcessamento(valor) {
    if (typeof loteEmProcessamento !== 'undefined') loteEmProcessamento = valor;
  }

  function normalizar(valor) {
    return String(valor || '')
      .trim()
      .toUpperCase()
      .normalize('NFD')
      .replace(/[\\u0300-\\u036f]/g, '');
  }

  function listaConvocar() {
    const portal = portalAtual();
    return portal && portal.convocar && Array.isArray(portal.convocar.todos)
      ? portal.convocar.todos
      : [];
  }

  function listaComplementares() {
    const portal = portalAtual();
    return portal && Array.isArray(portal.examesComplementares)
      ? portal.examesComplementares
      : [];
  }

  function obterSituacoes(lista) {
    return [...new Set((lista || []).map(item => item.situacao).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b));
  }

  function assinaturaSituacoes(lista) {
    return obterSituacoes(lista).map(normalizar).join('|');
  }

  function textoResumo(tipo, lista) {
    const selecionadas = obterSituacoes(lista)
      .filter(situacao => estado[tipo].has(normalizar(situacao)));

    if (selecionadas.length === 0) return 'Selecione';
    if (selecionadas.length <= 2) return selecionadas.join(', ');
    return selecionadas.slice(0, 2).join(', ') + ' +' + (selecionadas.length - 2);
  }

  function fecharFiltros(exceto) {
    document.querySelectorAll('.filtro-situacao-check.aberto').forEach(elemento => {
      if (elemento !== exceto) elemento.classList.remove('aberto');
    });
  }

  document.addEventListener('click', function () {
    fecharFiltros(null);
  });

  function renderizarFiltro(tipo, lista, referencia) {
    if (!referencia || !lista.length) return null;

    const linha = referencia.closest('.linha-filtros');
    if (!linha) return null;

    linha.querySelectorAll('.situacao-multipla').forEach(elemento => elemento.remove());

    const assinatura = assinaturaSituacoes(lista);
    let bloco = linha.querySelector('.filtro-situacao-check[data-tipo="' + tipo + '"]');

    if (bloco && bloco.dataset.assinatura === assinatura) {
      const botaoExistente = bloco.querySelector('.filtro-situacao-check-botao');
      if (botaoExistente) botaoExistente.textContent = textoResumo(tipo, lista);
      return bloco;
    }

    if (bloco) bloco.remove();

    bloco = document.createElement('div');
    bloco.className = 'filtro-situacao-check';
    bloco.dataset.tipo = tipo;
    bloco.dataset.assinatura = assinatura;
    bloco.innerHTML =
      '<label>Situação</label>' +
      '<button type="button" class="filtro-situacao-check-botao"></button>' +
      '<div class="filtro-situacao-check-lista"></div>';

    const alvo = referencia.closest('div');
    linha.insertBefore(bloco, alvo || linha.firstChild);

    const botao = bloco.querySelector('.filtro-situacao-check-botao');
    const caixa = bloco.querySelector('.filtro-situacao-check-lista');

    obterSituacoes(lista).forEach(situacao => {
      const chave = normalizar(situacao);
      const fixa = FIXAS.includes(chave);
      if (fixa) estado[tipo].add(chave);

      const label = document.createElement('label');
      label.className = 'filtro-situacao-check-opcao' + (fixa ? ' fixa' : '');

      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = fixa || estado[tipo].has(chave);
      input.disabled = fixa;

      const texto = document.createElement('span');
      texto.textContent = situacao;

      label.appendChild(input);
      label.appendChild(texto);
      caixa.appendChild(label);

      input.addEventListener('change', function () {
        if (input.checked) estado[tipo].add(chave);
        else estado[tipo].delete(chave);

        botao.textContent = textoResumo(tipo, lista);
        if (tipo === 'convocar') filtrarConvocarEstavel();
        else filtrarComplementaresEstavel();
      });
    });

    botao.textContent = textoResumo(tipo, lista);
    botao.addEventListener('click', function (evento) {
      evento.stopPropagation();
      const abrir = !bloco.classList.contains('aberto');
      fecharFiltros(bloco);
      bloco.classList.toggle('aberto', abrir);
    });

    caixa.addEventListener('click', function (evento) {
      evento.stopPropagation();
    });

    return bloco;
  }

  function montarFiltroConvocar() {
    const select = document.getElementById('filtroSituacaoConvocar');
    const lista = listaConvocar();
    if (!select || !lista.length) return;
    renderizarFiltro('convocar', lista, select);
  }

  function montarFiltroComplementares() {
    const grupo = document.getElementById('filtroGrupoComplementar');
    const lista = listaComplementares();
    if (!grupo || !lista.length) return;
    renderizarFiltro('complementares', lista, grupo);
  }

  function filtrarConvocarEstavel() {
    const portal = portalAtual();
    if (!portal || !portal.convocar) return;

    const termo = typeof obterTermoPesquisa === 'function'
      ? obterTermoPesquisa('pesquisaConvocar')
      : '';

    const filtrados = listaConvocar().filter(item =>
      estado.convocar.has(normalizar(item.situacao)) &&
      (!termo || correspondePesquisa(item, termo))
    );

    if (typeof renderizarConvocar === 'function') renderizarConvocar(filtrados);
  }

  function filtrarComplementaresEstavel() {
    const portal = portalAtual();
    if (!portal) return;

    const grupo = document.getElementById('filtroGrupoComplementar');
    const grupoSelecionado = grupo ? grupo.value || '' : '';
    const termo = typeof obterTermoPesquisa === 'function'
      ? obterTermoPesquisa('pesquisaComplementares')
      : '';

    const filtrados = listaComplementares().filter(item =>
      estado.complementares.has(normalizar(item.situacao)) &&
      (!grupoSelecionado || item.grupoComplementar === grupoSelecionado) &&
      (!termo || correspondePesquisaComplementar(item, termo))
    );

    if (typeof renderizarComplementares === 'function') {
      renderizarComplementares(filtrados);
    }
  }

  function removerColunaPrioridadeComplementares() {
    const tabela = document.querySelector('#tabelaComplementares table');
    if (!tabela) return;

    const cabecalhos = Array.from(tabela.querySelectorAll('thead th'));
    const indice = cabecalhos.findIndex(th => normalizar(th.textContent) === 'PRIORIDADE');
    if (indice < 0) return;

    tabela.querySelectorAll('tr').forEach(linha => {
      if (linha.children[indice]) linha.children[indice].remove();
    });
  }

  function examesComplementaresSelecionados(matriculas) {
    const chaves = new Set((matriculas || []).map(valor => String(valor || '').trim()));

    return listaComplementares().filter(item =>
      chaves.has(String(item.mat || '').trim()) ||
      chaves.has(String(item.matricula || '').trim()) ||
      chaves.has(String(item.matriculaCompleta || '').trim())
    );
  }

  function confirmarExamesComplementares(matriculas) {
    const itens = examesComplementaresSelecionados(matriculas);
    if (!itens.length) return true;

    const linhas = itens.map(item =>
      '• ' + (item.nome || 'Sem nome') + ' — ' +
      (item.grupoComplementar || 'Exame complementar')
    ).join('\\n');

    return window.confirm(
      'ATENÇÃO: os colaboradores abaixo necessitam realizar exames complementares antes do ASO:\\n\\n' +
      linhas +
      '\\n\\nConfirme se os exames já foram realizados ou providenciados. Deseja continuar com o envio ao gestor?'
    );
  }

  function enviarLoteGestorComCopia(matriculas, emailGestor) {
    if (processamentoAtivo()) {
      mostrarErro('Já existe uma geração/envio em lote em andamento. Aguarde finalizar.');
      return;
    }

    const lista = [...new Set((matriculas || []).map(String).filter(Boolean))];
    if (!lista.length) {
      mostrarErro('Nenhuma matrícula válida para enviar.');
      return;
    }

    if (!confirmarExamesComplementares(lista)) return;

    const dataInicio = document.getElementById('dataInicio').value;
    const dataFim = document.getElementById('dataFim').value;

    if (!dataInicio || !dataFim) {
      mostrarErro('Informe a data inicial e a data final.');
      return;
    }

    limparMensagens();
    limparStatusLote();

    const tamanhoLote = 30;
    let indice = 0;
    let sucesso = 0;
    let ignorados = 0;
    let falhas = 0;
    const motivos = {};

    definirProcessamento(true);
    mostrarLoading(true);
    atualizarProgressoLote(0, lista.length, 'Enviando convocações ao gestor');
    lista.forEach(mat => definirStatusLote(mat, 'aguardando-lote', '...', 'Aguardando envio'));

    function processarProximo() {
      const lote = lista.slice(indice, indice + tamanhoLote);

      if (!lote.length) {
        definirProcessamento(false);
        mostrarLoading(false);
        atualizarProgressoLote(lista.length, lista.length, 'Envio concluído');

        const resumo = Object.keys(motivos)
          .map(motivo => motivo + ': ' + motivos[motivo])
          .join(' | ');

        let texto = sucesso + ' convocação(ões) enviada(s) para ' + emailGestor +
          ', com cópia para thais.tpc@isgh.org.br. ' +
          ignorados + ' ignorado(s). ' + falhas + ' falha(s).';

        if (resumo) texto += ' Motivos: ' + resumo + '.';
        mostrarOk(texto);
        return;
      }

      google.script.run
        .withSuccessHandler(function (resultados) {
          (resultados || []).forEach(resultado => {
            const mat = String(resultado.matricula || '');

            if (resultado.sucesso) {
              sucesso++;
              definirStatusLote(mat, 'ok-lote', '@', resultado.arquivo || 'Convocação enviada');
            } else if (resultado.ignorado) {
              ignorados++;
              const motivo = resultado.motivo || 'Ignorado';
              motivos[motivo] = (motivos[motivo] || 0) + 1;
              definirStatusLote(mat, 'erro-lote', '!', motivo);
            } else {
              falhas++;
              definirStatusLote(mat, 'erro-lote', 'X', resultado.erro || 'Falha ao enviar');
            }
          });

          indice += lote.length;
          atualizarProgressoLote(
            Math.min(indice, lista.length),
            lista.length,
            'Enviando convocações ao gestor'
          );
          setTimeout(processarProximo, 300);
        })
        .withFailureHandler(function (erro) {
          lote.forEach(mat => definirStatusLote(mat, 'erro-lote', 'X', erro.message || erro));
          falhas += lote.length;
          indice += lote.length;
          atualizarProgressoLote(
            Math.min(indice, lista.length),
            lista.length,
            'Continuando após falha do lote'
          );
          setTimeout(processarProximo, 600);
        })
        .enviarConvocacoesSelecionadasGestorComCopia(
          lote,
          emailGestor,
          dataInicio,
          dataFim
        );
    }

    processarProximo();
  }

  function enviarPendenciaGestorComCopia(mat, dataAnteriorBR) {
    if (processamentoAtivo()) {
      mostrarErro('Já existe uma geração/envio em lote em andamento. Aguarde finalizar.');
      return;
    }

    const emails = typeof obterEmailsGestor === 'function' ? obterEmailsGestor() : [];
    if (!emails.length) {
      mostrarErro('Informe o e-mail do gestor antes de enviar a pendência.');
      return;
    }

    const invalidos = emails.filter(email => !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email));
    if (invalidos.length) {
      mostrarErro('E-mail(s) inválido(s): ' + invalidos.join(', '));
      return;
    }

    if (!confirmarExamesComplementares([mat])) return;

    const dataInicio = document.getElementById('dataInicio').value;
    const dataFim = document.getElementById('dataFim').value;

    if (!dataInicio || !dataFim) {
      mostrarErro('Informe a data inicial e a data final.');
      return;
    }

    limparMensagens();
    mostrarLoading(true);
    definirProcessamento(true);

    google.script.run
      .withSuccessHandler(function (resultados) {
        definirProcessamento(false);
        mostrarLoading(false);

        const resultado = (resultados || [])[0] || {};
        if (resultado.sucesso) {
          mostrarOk('Nova convocação enviada ao gestor, com cópia para thais.tpc@isgh.org.br.');
          carregarDados(true);
        } else if (resultado.ignorado) {
          mostrarErro(resultado.motivo || 'Convocação ignorada.');
        } else {
          mostrarErro(resultado.erro || 'Falha ao enviar nova convocação.');
        }
      })
      .withFailureHandler(function (erro) {
        definirProcessamento(false);
        mostrarLoading(false);
        mostrarErro(erro.message || erro);
      })
      .enviarReconvocacaoPendenciaGestorComCopia(
        mat,
        emails.join('; '),
        dataInicio,
        dataFim,
        dataAnteriorBR
      );
  }

  const abrirAbaOriginal = window.abrirAba;
  window.abrirAba = function (id, botao) {
    abrirAbaOriginal(id, botao);
    setTimeout(function () {
      if (id === 'convocar') montarFiltroConvocar();
      if (id === 'complementares') {
        montarFiltroComplementares();
        removerColunaPrioridadeComplementares();
      }
    }, 0);
  };

  const renderizarConvocarOriginal = window.renderizarConvocar;
  window.renderizarConvocar = function (lista) {
    renderizarConvocarOriginal(lista);
    montarFiltroConvocar();
  };

  const renderizarComplementaresOriginal = window.renderizarComplementares;
  window.renderizarComplementares = function (lista) {
    renderizarComplementaresOriginal(lista);
    montarFiltroComplementares();
    removerColunaPrioridadeComplementares();
  };

  const limparFiltrosOriginal = window.limparFiltrosLocais;
  window.limparFiltrosLocais = function () {
    estado.convocar = new Set(FIXAS);
    estado.complementares = new Set(FIXAS);
    if (typeof limparFiltrosOriginal === 'function') limparFiltrosOriginal();
    montarFiltroConvocar();
    montarFiltroComplementares();
  };

  window.filtrarConvocacaoPorSituacao = filtrarConvocarEstavel;
  window.filtrarComplementares = filtrarComplementaresEstavel;
  window.enviarLoteGestor = enviarLoteGestorComCopia;
  window.enviarPendenciaGestor = enviarPendenciaGestorComCopia;
})();
</script>

<script>
(function(){
  'use strict';

  let paginaGeralV15=1;
  const tamanhoPaginaGeralV15=100;
  let ultimaListaGeralV15=[];

  function atualizarStatusDadosV15(meta){
    const topo=document.querySelector('.painel-topbar>div');
    if(!topo)return;
    let status=topo.querySelector('.painel-status-v15');
    if(!status){
      status=document.createElement('div');
      status.className='painel-status-v15';
      topo.appendChild(status);
    }
    const gerado=meta&&meta.geradoEm?meta.geradoEm:'';
    const duracao=Number(meta&&meta.duracaoProcessamentoMs)||0;
    const origem=meta&&meta.origemCache?String(meta.origemCache):'';
    const detalhe=duracao>0?' • '+(duracao/1000).toFixed(1)+'s':'';
    status.classList.remove('atualizando');
    status.innerHTML='<span class="ponto"></span><span>'+(gerado?'Dados atualizados: '+gerado:'Base pronta')+detalhe+(origem&&origem!=='nova'?' • cache':'')+'</span>';
  }
  window.atualizarStatusDadosV15=atualizarStatusDadosV15;

  const mostrarLoadingAnterior=window.mostrarLoading;
  window.mostrarLoading=function(exibir){
    if(typeof mostrarLoadingAnterior==='function')mostrarLoadingAnterior(exibir);
    const botao=document.querySelector('.painel-atualizar');
    const status=document.querySelector('.painel-status-v15');
    if(botao){
      if(!botao.dataset.rotulo)botao.dataset.rotulo=botao.textContent||'Atualizar dados';
      botao.disabled=!!exibir;
      botao.textContent=exibir?'Atualizando...':botao.dataset.rotulo;
    }
    if(status)status.classList.toggle('atualizando',!!exibir);
  };

  function prepararCardsDashboardV15(){
    const mapa={
      totalConvocar:'abaConvocar',
      totalAgendados:'abaConvocar',
      totalCompareceram:'abaColaboradores',
      totalFaltosos:'abaFaltosos',
      totalPrioridade:'abaPrioridade',
      totalComplementares:'abaComplementares',
      totalVencidos:'abaVencidos',
      totalVencidosAtivos:'abaVencidos'
    };
    Object.keys(mapa).forEach(id=>{
      const numero=document.getElementById(id);
      const card=numero&&numero.closest('.card');
      if(!card||card.dataset.v15Destino)return;
      card.dataset.v15Destino=mapa[id];
      card.setAttribute('role','button');
      card.tabIndex=0;
      const abrir=()=>{const aba=document.getElementById(mapa[id]);if(aba)aba.click()};
      card.addEventListener('click',abrir);
      card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();abrir()}});
    });
  }

  const atualizarDashboardAnterior=window.atualizarDashboard;
  window.atualizarDashboard=function(d){
    if(typeof atualizarDashboardAnterior==='function')atualizarDashboardAnterior(d);
    prepararCardsDashboardV15();
    if(typeof dadosPortal!=='undefined'&&dadosPortal&&dadosPortal.meta)atualizarStatusDadosV15(dadosPortal.meta);
  };

  const renderizarColaboradoresAnterior=window.renderizarColaboradores;
  window.renderizarColaboradores=function(lista){
    ultimaListaGeralV15=Array.isArray(lista)?lista:[];
    const total=ultimaListaGeralV15.length;
    const totalPaginas=Math.max(1,Math.ceil(total/tamanhoPaginaGeralV15));
    paginaGeralV15=Math.min(Math.max(1,paginaGeralV15),totalPaginas);
    const inicio=(paginaGeralV15-1)*tamanhoPaginaGeralV15;
    const fim=Math.min(inicio+tamanhoPaginaGeralV15,total);
    const pagina=ultimaListaGeralV15.slice(inicio,fim);

    if(typeof renderizarColaboradoresAnterior==='function')renderizarColaboradoresAnterior(pagina);

    const div=document.getElementById('tabelaColaboradores');
    if(!div||!total)return;
    const barra=document.createElement('div');
    barra.className='v15-paginacao';
    barra.innerHTML='<div><span class="v15-contagem">'+total+' colaborador(es)</span> • exibindo '+(inicio+1)+'–'+fim+'</div><div class="v15-paginacao-acoes"></div>';
    const acoes=barra.querySelector('.v15-paginacao-acoes');
    const anterior=document.createElement('button');
    anterior.type='button';anterior.textContent='←';anterior.title='Página anterior';anterior.disabled=paginaGeralV15<=1;
    anterior.onclick=()=>{paginaGeralV15--;window.renderizarColaboradores(ultimaListaGeralV15);div.scrollIntoView({block:'start'})};
    const texto=document.createElement('span');texto.textContent=paginaGeralV15+' / '+totalPaginas;
    const proxima=document.createElement('button');
    proxima.type='button';proxima.textContent='→';proxima.title='Próxima página';proxima.disabled=paginaGeralV15>=totalPaginas;
    proxima.onclick=()=>{paginaGeralV15++;window.renderizarColaboradores(ultimaListaGeralV15);div.scrollIntoView({block:'start'})};
    acoes.append(anterior,texto,proxima);
    div.appendChild(barra);
  };

  const filtrarColaboradoresAnterior=window.filtrarColaboradores;
  window.filtrarColaboradores=function(){
    paginaGeralV15=1;
    if(typeof filtrarColaboradoresAnterior==='function')filtrarColaboradoresAnterior();
  };

  const renderizarConvocarAnterior=window.renderizarConvocar;
  window.renderizarConvocar=function(lista){
    // Executa o fluxo anterior para preservar filtros/estado de seleção.
    if(typeof renderizarConvocarAnterior==='function')renderizarConvocarAnterior(lista);

    const div=document.getElementById('tabelaConvocar');
    if(!div||!Array.isArray(lista)||!lista.length)return;

    const grupos=[
      {
        chave:'Pendência anterior',
        titulo:'Pendências anteriores',
        classe:'v15-grupo-pendente',
        descricao:'Convocações que já deveriam ter sido tratadas e ainda não tiveram periódico válido concluído.'
      },
      {
        chave:'Convocação do período',
        titulo:'Convocações do período',
        classe:'v15-grupo-periodo',
        descricao:'Colaboradores cuja janela de convocação se inicia no período selecionado.'
      },
      {
        chave:'Agendado no período',
        titulo:'Agendados no período',
        classe:'v15-grupo-agendado',
        descricao:'Periódicos agendados no período, inclusive os originados em meses anteriores.'
      }
    ];

    const blocos=grupos.map(g=>{
      const itens=lista.filter(i=>String(i.grupoConvocacao||'')===g.chave);
      if(!itens.length)return '';
      return '<section class="v15-grupo-convocar '+g.classe+'"><h3><span>'+g.titulo+'</span><span class="contador-secao">'+itens.length+'</span></h3><p class="v15-grupo-descricao">'+g.descricao+'</p>'+montarTabelaConvocar(itens)+'</section>';
    }).join('');

    const semGrupo=lista.filter(i=>!grupos.some(g=>g.chave===String(i.grupoConvocacao||'')));
    const revisoes=lista.filter(i=>i&&i.revisaoDados);
    const alerta=revisoes.length
      ? '<div class="v15-alerta-revisao"><strong>'+revisoes.length+' registro(s) para revisão:</strong> há ASO realizado sem tipo de exame informado. Esses casos permanecem na fila até a conferência.</div>'
      : '';
    div.innerHTML=alerta+blocos+(semGrupo.length?'<section class="v15-grupo-convocar"><h3>Outros <span class="contador-secao">'+semGrupo.length+'</span></h3>'+montarTabelaConvocar(semGrupo)+'</section>':'');

    const mapaItens=new Map(lista.map(i=>[String(i.mat||''),i]));
    div.querySelectorAll('tr[data-mat]').forEach(tr=>{
      const item=mapaItens.get(String(tr.dataset.mat||''));
      if(!item)return;
      const celulaInfo=tr.children[9];
      if(celulaInfo&&item.statusOperacional){
        const chip=document.createElement('div');
        chip.className='v15-chip'+(item.revisaoDados?' v15-chip-revisao':'');
        chip.textContent=item.statusOperacional;
        celulaInfo.prepend(chip);
      }
    });

    if(typeof ativarOrdenacaoTabelas==='function')ativarOrdenacaoTabelas('tabelaConvocar');
    if(typeof atualizarTextoSelecaoLote==='function')atualizarTextoSelecaoLote();
  };

  function ajustarTitulosV15(){
    const mapa={
      '#faltosos h2':'Pendências de ASO',
      '#prioridade h2':'Prioridade — vence em até 30 dias',
      '#vencidos h2':'ASOs vencidos',
      '#colaboradores h2':'Consulta geral',
      '#complementares h2':'Exames complementares'
    };
    Object.keys(mapa).forEach(sel=>{const el=document.querySelector(sel);if(el)el.textContent=mapa[sel]});
    const brand=document.querySelector('.painel-brand span');if(brand)brand.textContent='Gestão de ASOs • V15';
    const titulo=document.querySelector('.painel-topbar h1');if(titulo)titulo.textContent='PAINEL DE ASOS • SESMT HRC';
  }

  document.addEventListener('DOMContentLoaded',function(){
    setTimeout(function(){
      ajustarTitulosV15();
      prepararCardsDashboardV15();
      if(typeof dadosPortal!=='undefined'&&dadosPortal&&dadosPortal.meta)atualizarStatusDadosV15(dadosPortal.meta);
    },350);
  });
})();
</script>
