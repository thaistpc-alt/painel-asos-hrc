<style>

#tabelaVencidos th:nth-child(1),#tabelaVencidos td:nth-child(1){width:6%}

#tabelaVencidos th:nth-child(3),#tabelaVencidos td:nth-child(3){width:16%}
#tabelaPrioridade th:nth-child(4),#tabelaPrioridade td:nth-child(4),
#tabelaVencidos th:nth-child(4),#tabelaVencidos td:nth-child(4){width:17%}
#tabelaPrioridade th:nth-child(5),#tabelaPrioridade td:nth-child(5),
#tabelaVencidos th:nth-child(5),#tabelaVencidos td:nth-child(5){width:10%}
#tabelaPrioridade th:nth-child(6),#tabelaPrioridade td:nth-child(6),
#tabelaVencidos th:nth-child(6),#tabelaVencidos td:nth-child(6){width:10%}
#tabelaPrioridade th:nth-child(7),#tabelaPrioridade td:nth-child(7),
#tabelaVencidos th:nth-child(7),#tabelaVencidos td:nth-child(7){width:6%;text-align:center!important}

/* Convocar */
#tabelaConvocar th,#tabelaConvocar td{padding:3px 2px!important;font-size:7.7px!important}
#tabelaConvocar th{font-size:6.9px!important}
#tabelaConvocar th:nth-child(1),#tabelaConvocar td:nth-child(1){width:2.5%}
#tabelaConvocar th:nth-child(2),#tabelaConvocar td:nth-child(2){width:4.5%}
#tabelaConvocar th:nth-child(3),#tabelaConvocar td:nth-child(3){width:14%}
#tabelaConvocar th:nth-child(4),#tabelaConvocar td:nth-child(4){width:10%}
#tabelaConvocar th:nth-child(5),#tabelaConvocar td:nth-child(5){width:11%}
#tabelaConvocar th:nth-child(6),#tabelaConvocar td:nth-child(6){width:7%}
#tabelaConvocar th:nth-child(7),#tabelaConvocar td:nth-child(7){width:7%}
#tabelaConvocar th:nth-child(8),#tabelaConvocar td:nth-child(8){width:7%}

#tabelaConvocar th:nth-child(10),#tabelaConvocar td:nth-child(10){width:8%}
#tabelaConvocar th:nth-child(11),#tabelaConvocar td:nth-child(11){width:4.5%;text-align:center!important}
#tabelaConvocar th:nth-child(12),#tabelaConvocar td:nth-child(12){width:5.5%;text-align:center!important}
#tabelaConvocar th:nth-child(13),#tabelaConvocar td:nth-child(13){width:3.5%;text-align:center!important}
#tabelaConvocar th:nth-child(14),#tabelaConvocar td:nth-child(14){width:3.5%;text-align:center!important}
#tabelaConvocar td button{width:28px!important;min-width:28px!important}

/* Exames complementares */
#tabelaComplementares th,#tabelaComplementares td{font-size:7.5px!important;padding:3px 2px!important}
#tabelaComplementares th:nth-child(1),#tabelaComplementares td:nth-child(1){width:10%}
#tabelaComplementares th:nth-child(2),#tabelaComplementares td:nth-child(2){width:6%}
#tabelaComplementares th:nth-child(3),#tabelaComplementares td:nth-child(3){width:15%}
#tabelaComplementares th:nth-child(4),#tabelaComplementares td:nth-child(4){width:13%}
#tabelaComplementares th:nth-child(5),#tabelaComplementares td:nth-child(5){width:11%}
#tabelaComplementares th:nth-child(6),#tabelaComplementares td:nth-child(6){width:9%}
#tabelaComplementares th:nth-child(7),#tabelaComplementares td:nth-child(7){width:7%}
#tabelaComplementares th:nth-child(8),#tabelaComplementares td:nth-child(8){width:7%}
#tabelaComplementares th:nth-child(9),#tabelaComplementares td:nth-child(9){width:7%}
#tabelaComplementares th:nth-child(10),#tabelaComplementares td:nth-child(10){width:7%}
#tabelaComplementares th:nth-child(11),#tabelaComplementares td:nth-child(11){width:6%}
#tabelaComplementares th:nth-child(12),#tabelaComplementares td:nth-child(12){width:4%;text-align:center!important}
#tabelaComplementares th:nth-child(13),#tabelaComplementares td:nth-child(13){width:8%}

/* Seletor múltiplo de situação */
.situacao-multipla{position:relative;width:248px}
.situacao-multipla-botao{width:100%;height:36px!important;background:#fff!important;color:#0f172a!important;border:1px solid #cbd5e1!important;text-align:left!important;padding:0 30px 0 10px!important;font-weight:normal!important;position:relative}
.situacao-multipla-botao:after{content:'▾';position:absolute;right:10px;top:9px;color:#475569}
.situacao-multipla-lista{display:none;position:absolute;top:40px;left:0;z-index:1200;width:285px;max-height:300px;overflow:auto;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 10px 24px rgba(15,23,42,.18);padding:8px}
.situacao-multipla.aberta .situacao-multipla-lista{display:block}
.situacao-opcao{display:flex!important;align-items:center;gap:8px;padding:6px 5px;margin:0!important;font-size:11px!important;cursor:pointer;color:#0f172a!important}
.situacao-opcao:hover{background:#f1f5f9;border-radius:6px}
.situacao-opcao input{width:14px!important;height:14px!important;min-width:14px!important;margin:0!important}
.situacao-opcao.fixa{font-weight:bold}
.situacao-opcao.fixa span:after{content:' • fixa';font-size:9px;color:#64748b;font-weight:normal}
#filtroSituacaoConvocar{display:none!important}

@media(max-width:1150px){
  .painel-topbar-periodo>div,.painel-topbar-periodo input{width:116px!important;min-width:116px!important}
  .painel-topbar h1{font-size:18px!important}.painel-topbar p{display:none}
}
</style>

<script>
(function(){
  const SITUACOES_FIXAS=['ATIVO','FERIAS'];
  let situacoesSelecionadas=new Set(SITUACOES_FIXAS);

  function normalizar(valor){
    return String(valor||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }

  function moverPeriodoParaCabecalho(){
    const topbar=document.querySelector('.painel-topbar');
    const atualizar=topbar&&topbar.querySelector('.painel-atualizar');
    const filtros=document.querySelector('.filtros');
    const inicio=document.getElementById('dataInicio');
    const fim=document.getElementById('dataFim');
    if(!topbar||!atualizar||!filtros||!inicio||!fim||topbar.querySelector('.painel-topbar-periodo'))return;

    const bloco=document.createElement('div');bloco.className='painel-topbar-acoes';
    const periodo=document.createElement('div');periodo.className='painel-topbar-periodo';
    periodo.appendChild(inicio.closest('div'));periodo.appendChild(fim.closest('div'));

    const filtrar=Array.from(filtros.querySelectorAll('button')).find(b=>b.textContent.trim().toLowerCase()==='filtrar');
    if(filtrar)periodo.appendChild(filtrar);

    const limpar=document.createElement('button');
    limpar.type='button';limpar.className='painel-limpar-periodo';limpar.textContent='Limpar';
    limpar.onclick=function(){
      const hoje=new Date();
      const ini=new Date(hoje.getFullYear(),hoje.getMonth(),1);
      const finalMes=new Date(hoje.getFullYear(),hoje.getMonth()+1,0);
      inicio.value=formatarDataInput(ini);fim.value=formatarDataInput(finalMes);
      resetarSituacoes();
      const pesquisas=document.querySelectorAll('.linha-filtros input[type="text"],.linha-filtros input[type="email"]');
      pesquisas.forEach(el=>el.value='');
      document.querySelectorAll('.linha-filtros select').forEach(el=>el.value='');
      carregarDados(false);
    };
    periodo.appendChild(limpar);

    bloco.appendChild(periodo);bloco.appendChild(atualizar);topbar.appendChild(bloco);
  }

  function obterSituacoesLista(){
    const lista=dadosPortal&&dadosPortal.convocar&&dadosPortal.convocar.todos||[];
    return [...new Set(lista.map(i=>i.situacao).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  }

  function atualizarResumoSituacoes(){
    const botao=document.querySelector('.situacao-multipla-botao');if(!botao)return;
    const nomes=[];
    obterSituacoesLista().forEach(s=>{if(situacoesSelecionadas.has(normalizar(s)))nomes.push(s)});
    botao.textContent=nomes.length<=2?nomes.join(', '):(nomes.slice(0,2).join(', ')+' +'+(nomes.length-2));
  }

  function aplicarFiltroSituacoes(){
    if(!dadosPortal||!dadosPortal.convocar)return;
    const termo=obterTermoPesquisa('pesquisaConvocar');
    const lista=(dadosPortal.convocar.todos||[]).filter(item=>situacoesSelecionadas.has(normalizar(item.situacao))&&correspondePesquisa(item,termo));
    renderizarConvocar(lista);quebrarCabecalhos();
  }

  function resetarSituacoes(){
    situacoesSelecionadas=new Set(SITUACOES_FIXAS);
    document.querySelectorAll('.situacao-multipla-lista input[type="checkbox"]').forEach(cb=>{
      const fixa=SITUACOES_FIXAS.includes(cb.dataset.normalizada);cb.checked=fixa;
    });
    atualizarResumoSituacoes();aplicarFiltroSituacoes();
  }

  function montarFiltroSituacao(){
    const select=document.getElementById('filtroSituacaoConvocar');
    if(!select||document.querySelector('.situacao-multipla'))return;
    const pai=select.closest('div');if(!pai)return;
    const controle=document.createElement('div');controle.className='situacao-multipla';
    controle.innerHTML='<button type="button" class="situacao-multipla-botao">Ativo, Férias</button><div class="situacao-multipla-lista"></div>';
    pai.appendChild(controle);
    const lista=controle.querySelector('.situacao-multipla-lista');
    obterSituacoesLista().forEach(s=>{
      const n=normalizar(s),fixa=SITUACOES_FIXAS.includes(n);
      const label=document.createElement('label');label.className='situacao-opcao'+(fixa?' fixa':'');
      label.innerHTML='<input type="checkbox" data-normalizada="'+n.replace(/"/g,'&quot;')+'" '+(fixa?'checked disabled':'')+'><span></span>';
      label.querySelector('span').textContent=s;
      const cb=label.querySelector('input');
      cb.addEventListener('change',function(){if(cb.checked)situacoesSelecionadas.add(n);else situacoesSelecionadas.delete(n);atualizarResumoSituacoes();aplicarFiltroSituacoes()});
      lista.appendChild(label);
    });
    controle.querySelector('.situacao-multipla-botao').onclick=()=>controle.classList.toggle('aberta');
    document.addEventListener('click',e=>{if(!controle.contains(e.target))controle.classList.remove('aberta')});
    atualizarResumoSituacoes();
  }

  window.carregarFiltroSituacao=function(){montarFiltroSituacao();atualizarResumoSituacoes()};
  window.filtrarConvocacaoPorSituacao=aplicarFiltroSituacoes;

  const limparOriginal=window.limparFiltrosLocais;
  window.limparFiltrosLocais=function(){
    if(typeof limparOriginal==='function')limparOriginal();
    resetarSituacoes();
  };

  function quebrarCabecalhos(){
    const mapa={
      'DATA CONVOCAR':'Data<br>convocar','DATA LIMITE':'Data<br>limite','DATA AGENDADA':'Data<br>agendada',
      'STATUS AGENDA':'Status<br>agenda','ULTIMA PENDENCIA':'Última<br>pendência','NOVA DATA':'Nova<br>data',
      'PROX. VENC.':'Próx.<br>venc.','GRUPO DE EXAME':'Grupo de<br>exame','MATRICULA':'Matrícula',
      'CONVOCACOES ENVIADAS':'Convocações<br>enviadas'
    };
    document.querySelectorAll('.conteudo table thead th').forEach(th=>{
      if(th.querySelector('input'))return;
      const chave=normalizar(th.textContent).replace(/\s+/g,' ');
      if(mapa[chave])th.innerHTML=mapa[chave];
    });
  }

  window.renderizarComplementares=function(lista){
    const cards=document.getElementById('cardsComplementares'),div=document.getElementById('tabelaComplementares');if(!cards||!div)return;
    cards.innerHTML=`<div class="indicador-card"><div class="titulo">Total no período</div><div class="valor">${escaparHtml((lista||[]).length)}</div></div><div class="indicador-card ruim"><div class="titulo">Atrasados</div><div class="valor">${escaparHtml((lista||[]).filter(i=>Number(i.diasParaVencer)<0).length)}</div></div><div class="indicador-card alerta"><div class="titulo">Até 7 dias</div><div class="valor">${escaparHtml((lista||[]).filter(i=>Number(i.diasParaVencer)>=0&&Number(i.diasParaVencer)<=7).length)}</div></div><div class="indicador-card"><div class="titulo">Com agendamento</div><div class="valor">${escaparHtml((lista||[]).filter(i=>dataISOEstaNoPeriodoPortal(i.dataAgendada)).length)}</div></div>`;
    if(!lista||!lista.length){div.innerHTML='<div class="vazio">Nenhum colaborador com necessidade de exame complementar no período selecionado.</div>';return}
    let html=`<div class="tabela-container tabela-complementares"><table><thead><tr><th>Grupo</th><th>Matrícula</th><th>Nome</th><th>Função</th><th>Setor</th><th>Situação</th><th>Data convocar</th><th>Data limite</th><th>Vencimento</th><th>Data agendada</th><th>Status agenda</th><th>Dias</th><th>Prioridade</th></tr></thead><tbody>`;
    lista.forEach(item=>{const agendada=dataISOEstaNoPeriodoPortal(item.dataAgendada)?item.dataAgendadaBR:'Pendente';const status=dataISOEstaNoPeriodoPortal(item.dataAgendada)?item.statusAgenda:'';html+=`<tr><td>${escaparHtml(item.grupoComplementar)}</td><td>${escaparHtml(item.mat)}</td><td>${escaparHtml(item.nome)}</td><td>${escaparHtml(item.funcao)}</td><td>${escaparHtml(item.setor)}</td><td>${escaparHtml(item.situacao)}</td><td>${escaparHtml(item.dataConvocarBR)}</td><td>${escaparHtml(item.dataLimiteBR)}</td><td>${escaparHtml(item.proximoVencimentoBR)}</td><td>${escaparHtml(agendada)}</td><td>${escaparHtml(status)}</td><td>${escaparHtml(item.diasParaVencer)}</td><td>${badgePrioridadeComplementar(item.prioridadeComplementar)}</td></tr>`});
    html+='</tbody></table></div>';div.innerHTML=html;ativarOrdenacaoTabelas('tabelaComplementares');quebrarCabecalhos();
  };

  function inicializar(){moverPeriodoParaCabecalho();montarFiltroSituacao();quebrarCabecalhos()}
  document.addEventListener('DOMContentLoaded',()=>{setTimeout(inicializar,0);setTimeout(inicializar,350)});
  new MutationObserver(()=>{moverPeriodoParaCabecalho();montarFiltroSituacao();quebrarCabecalhos()}).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
