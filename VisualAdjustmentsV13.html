<script>
(function(){
  const FIXAS=['ATIVO','FERIAS'];
  let selecionadas=new Set(FIXAS),selecionadasComplementares=new Set(FIXAS),tokenGeral=0;
  const norm=v=>String(v||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

  function removerLimparAntigo(){document.querySelectorAll('.filtros>button,#toolbarModulo>button,.linha-filtros>button').forEach(b=>{if(b.textContent.trim().toLowerCase()==='limpar'&&!b.classList.contains('painel-limpar-periodo'))b.remove();});}
  function moverPeriodo(){const top=document.querySelector('.painel-topbar'),atualizar=top&&top.querySelector('.painel-atualizar'),filtros=document.querySelector('.filtros'),inicio=document.getElementById('dataInicio'),fim=document.getElementById('dataFim');if(!top||!atualizar||!filtros||!inicio||!fim)return;removerLimparAntigo();if(top.querySelector('.painel-topbar-periodo'))return;const bloco=document.createElement('div');bloco.className='painel-topbar-acoes';const periodo=document.createElement('div');periodo.className='painel-topbar-periodo';periodo.appendChild(inicio.closest('div'));periodo.appendChild(fim.closest('div'));const filtrar=[...filtros.querySelectorAll('button')].find(b=>b.textContent.trim().toLowerCase()==='filtrar');if(filtrar)periodo.appendChild(filtrar);const atalhos=document.createElement('div');atalhos.className='painel-periodo-atalhos';[['Mês atual',0],['Próximo mês',1]].forEach(cfg=>{const b=document.createElement('button');b.type='button';b.className='periodo-atalho';b.textContent=cfg[0];b.onclick=function(){const h=new Date(),base=new Date(h.getFullYear(),h.getMonth()+cfg[1],1),ini=new Date(base.getFullYear(),base.getMonth(),1),fm=new Date(base.getFullYear(),base.getMonth()+1,0);inicio.value=formatarDataInput(ini);fim.value=formatarDataInput(fm);carregarDados(false)};atalhos.appendChild(b)});periodo.appendChild(atalhos);const limpar=document.createElement('button');limpar.type='button';limpar.className='painel-limpar-periodo';limpar.textContent='Limpar';limpar.onclick=function(){const h=new Date(),ini=new Date(h.getFullYear(),h.getMonth(),1),fm=new Date(h.getFullYear(),h.getMonth()+1,0);inicio.value=formatarDataInput(ini);fim.value=formatarDataInput(fm);resetarSituacoes();resetarSituacoesComplementares();document.querySelectorAll('.linha-filtros input[type="text"],.linha-filtros input[type="email"]').forEach(el=>el.value='');document.querySelectorAll('.linha-filtros select').forEach(el=>el.value='');carregarDados(false)};periodo.appendChild(limpar);bloco.appendChild(periodo);const sync=top.querySelector('#painelSync');if(sync)bloco.appendChild(sync);bloco.appendChild(atualizar);top.appendChild(bloco);const vazio=top.querySelector('.painel-topbar-status');if(vazio&&!vazio.children.length)vazio.remove();}

  function situacoesDisponiveis(){const lista=dadosPortal&&dadosPortal.convocar&&dadosPortal.convocar.todos||[];return[...new Set(lista.map(i=>i.situacao).filter(Boolean))].sort((a,b)=>a.localeCompare(b));}
  function atualizarResumoSituacoes(){const b=document.querySelector('.situacao-multipla:not(.situacao-complementares) .situacao-multipla-botao');if(!b)return;const nomes=situacoesDisponiveis().filter(s=>selecionadas.has(norm(s)));b.textContent=nomes.length<=2?nomes.join(', '):nomes.slice(0,2).join(', ')+' +'+(nomes.length-2);}
  function aplicarSituacoes(){if(!dadosPortal||!dadosPortal.convocar)return;const termo=obterTermoPesquisa('pesquisaConvocar');renderizarConvocar((dadosPortal.convocar.todos||[]).filter(i=>selecionadas.has(norm(i.situacao))&&correspondePesquisa(i,termo)));ajustarConvocar();quebrarCabecalhos();}
  function resetarSituacoes(){selecionadas=new Set(FIXAS);document.querySelectorAll('.situacao-multipla:not(.situacao-complementares) .situacao-multipla-lista input').forEach(cb=>cb.checked=FIXAS.includes(cb.dataset.normalizada));atualizarResumoSituacoes();aplicarSituacoes();}
  function montarFiltroSituacao(){const select=document.getElementById('filtroSituacaoConvocar');if(!select)return;const existente=document.querySelector('.situacao-multipla:not(.situacao-complementares)');if(existente){atualizarResumoSituacoes();return}const pai=select.closest('div');if(!pai)return;const controle=document.createElement('div');controle.className='situacao-multipla';controle.innerHTML='<button type="button" class="situacao-multipla-botao">Ativo, Férias</button><div class="situacao-multipla-lista"></div>';pai.appendChild(controle);const lista=controle.querySelector('.situacao-multipla-lista');situacoesDisponiveis().forEach(s=>{const n=norm(s),fixa=FIXAS.includes(n),label=document.createElement('label');label.className='situacao-opcao'+(fixa?' fixa':'');label.innerHTML='<input type="checkbox" data-normalizada="'+n.replace(/"/g,'&quot;')+'" '+(fixa?'checked disabled':'')+'><span></span>';label.querySelector('span').textContent=s;const cb=label.querySelector('input');cb.onchange=()=>{cb.checked?selecionadas.add(n):selecionadas.delete(n);atualizarResumoSituacoes();aplicarSituacoes()};lista.appendChild(label)});controle.querySelector('.situacao-multipla-botao').onclick=()=>controle.classList.toggle('aberta');atualizarResumoSituacoes();}

  function situacoesComplementaresDisponiveis(){const lista=dadosPortal&&dadosPortal.examesComplementares||[];return[...new Set(lista.map(i=>i.situacao).filter(Boolean))].sort((a,b)=>a.localeCompare(b));}
  function atualizarResumoComplementares(){const b=document.querySelector('.situacao-complementares .situacao-multipla-botao');if(!b)return;const nomes=situacoesComplementaresDisponiveis().filter(s=>selecionadasComplementares.has(norm(s)));b.textContent=nomes.length<=2?nomes.join(', '):nomes.slice(0,2).join(', ')+' +'+(nomes.length-2);}
  function resetarSituacoesComplementares(){selecionadasComplementares=new Set(FIXAS);document.querySelectorAll('.situacao-complementares input').forEach(cb=>cb.checked=FIXAS.includes(cb.dataset.normalizada));atualizarResumoComplementares();if(dadosPortal&&dadosPortal.examesComplementares)filtrarComplementaresAjustado();}
  function montarFiltroSituacaoComplementares(){const linha=document.querySelector('#complementares .linha-filtros');if(!linha||linha.querySelector('.situacao-complementares'))return;const bloco=document.createElement('div');bloco.className='situacao-multipla situacao-complementares';bloco.innerHTML='<label>Situação</label><button type="button" class="situacao-multipla-botao">Ativo, Férias</button><div class="situacao-multipla-lista"></div>';const grupo=document.getElementById('filtroGrupoComplementar');const grupoBloco=grupo&&grupo.closest('div');linha.insertBefore(bloco,grupoBloco||linha.firstChild);const lista=bloco.querySelector('.situacao-multipla-lista');situacoesComplementaresDisponiveis().forEach(s=>{const n=norm(s),fixa=FIXAS.includes(n),label=document.createElement('label');label.className='situacao-opcao'+(fixa?' fixa':'');label.innerHTML='<input type="checkbox" data-normalizada="'+n.replace(/"/g,'&quot;')+'" '+(fixa?'checked disabled':'')+'><span></span>';label.querySelector('span').textContent=s;const cb=label.querySelector('input');cb.onchange=()=>{cb.checked?selecionadasComplementares.add(n):selecionadasComplementares.delete(n);atualizarResumoComplementares();filtrarComplementaresAjustado()};lista.appendChild(label)});bloco.querySelector('.situacao-multipla-botao').onclick=()=>bloco.classList.toggle('aberta');atualizarResumoComplementares();}
  function filtrarComplementaresAjustado(){if(!dadosPortal)return;const grupo=document.getElementById('filtroGrupoComplementar')?.value||'',termo=obterTermoPesquisa('pesquisaComplementares');const lista=(dadosPortal.examesComplementares||[]).filter(i=>selecionadasComplementares.has(norm(i.situacao))&&(!grupo||i.grupoComplementar===grupo)&&(!termo||correspondePesquisaComplementar(i,termo)));renderizarComplementares(lista);}

  function ajustarConvocar(){const th=[...document.querySelectorAll('#tabelaConvocar thead th')].find(c=>norm(c.textContent)==='MATRICULA');if(th){th.textContent='MAT';th.dataset.quebrado='1';}}
  function quebrarCabecalhos(){const mapa={'DATA CONVOCAR':'Data<br>convocar','DATA LIMITE':'Data<br>limite','DATA AGENDADA':'Data<br>agendada','STATUS AGENDA':'Status<br>agenda','ULTIMA PENDENCIA':'Última<br>pendência','NOVA DATA':'Nova<br>data','PROX. VENC.':'Próx.<br>venc.','DATA LIMITE PARA REALIZAR':'Data limite<br>para realizar','DATA REALIZADA':'Data<br>realizada','VENCIMENTO AVALIADO':'Vencimento<br>avaliado','MES ANALISADO':'Mês<br>analisado'};document.querySelectorAll('.conteudo table thead th').forEach(th=>{if(th.querySelector('input'))return;const k=norm(th.textContent).replace(/\s+/g,' ');if(mapa[k]&&th.dataset.quebrado!=='1'){th.innerHTML=mapa[k];th.dataset.quebrado='1'}});ajustarConvocar();}

  function carregarGeralSeguro(){const inicio=document.getElementById('dataInicio')?.value||'',fim=document.getElementById('dataFim')?.value||'';if(!inicio||!fim)return;const meuToken=++tokenGeral,div=document.getElementById('tabelaColaboradores');if(div)div.innerHTML='<div class="vazio">Carregando colaboradores...</div>';google.script.run.withSuccessHandler(r=>{if(meuToken!==tokenGeral)return;const ai=document.getElementById('dataInicio')?.value||'',af=document.getElementById('dataFim')?.value||'';if(ai!==inicio||af!==fim)return;dadosPortal=Object.assign(dadosPortal||{},r||{});filtrarColaboradores();quebrarCabecalhos()}).withFailureHandler(e=>{if(meuToken===tokenGeral&&div)div.innerHTML='<div class="vazio">Erro ao carregar colaboradores: '+escaparHtml(e.message||e)+'</div>'}).obterModuloPortalV13('COLABORADORES',inicio,fim,false);}

  // V15: o filtro operacional de situação é único e é montado pelo bloco final do code.gs.
  // Mantemos apenas os ajustes visuais desta camada, evitando criar e remover um segundo filtro.
  window.carregarFiltroSituacao=function(){};
  const limparOriginal=window.limparFiltrosLocais;window.limparFiltrosLocais=function(){if(typeof limparOriginal==='function')limparOriginal()};
  const abrirOriginal=window.abrirAba;window.abrirAba=function(id,botao){abrirOriginal(id,botao);removerLimparAntigo();setTimeout(()=>{quebrarCabecalhos();ajustarIndicadores()},0)};

  const renderComplementaresOriginal=window.renderizarComplementares;window.renderizarComplementares=function(lista){if(typeof renderComplementaresOriginal==='function')renderComplementaresOriginal(lista);const cards=document.getElementById('cardsComplementares');if(cards)cards.innerHTML='';const tabela=document.querySelector('#tabelaComplementares table');if(tabela&&!tabela.querySelector('th[data-situacao]')){tabela.querySelectorAll('tr').forEach((tr,idx)=>{const cel=document.createElement(idx===0?'th':'td');if(idx===0){cel.textContent='Situação';cel.dataset.situacao='1';tr.insertBefore(cel,tr.children[5]||null)}else{const item=(lista||[])[idx-1];cel.textContent=item&&item.situacao||'';tr.insertBefore(cel,tr.children[5]||null)}})}quebrarCabecalhos()};

  function ajustarIndicadores(){const grafico=document.getElementById('graficoMetaMensal');if(grafico){const titulo=grafico.previousElementSibling;if(titulo&&norm(titulo.textContent)==='DESEMPENHO MENSAL DA META')titulo.remove();grafico.remove()}document.querySelectorAll('#analiseIndicadorMensal .analise-bloco h3 span:first-child').forEach(s=>{if(norm(s.textContent).includes('ASOS ATRASADOS REALIZADOS NO MES DA ANALISE'))s.textContent='Atrasados no vencimento — relação nominal'});quebrarCabecalhos()}
  const renderIndicadoresOriginal=window.renderizarIndicadores;window.renderizarIndicadores=function(ind){if(typeof renderIndicadoresOriginal==='function')renderIndicadoresOriginal(ind);ajustarIndicadores()};
  function iniciar(){moverPeriodo();removerLimparAntigo();montarFiltroSituacao();quebrarCabecalhos();ajustarIndicadores()}
  document.addEventListener('DOMContentLoaded',()=>{setTimeout(iniciar,0);setTimeout(iniciar,300)});
})();
</script>

<style>
/* A coluna de informações foi acrescentada ao Convocar após as larguras V14.
   O quadro precisa de espaço próprio e rolagem horizontal em telas menores. */

<style>
/* Dropdown de Situação em camada fixa, sem alterar a altura da barra de filtros. */
.filtro-situacao-check-lista{
  position:fixed!important;
  top:auto!important;
  left:auto!important;
  z-index:30000!important;
  max-height:min(300px,calc(100vh - 24px))!important;
  overflow-x:hidden!important;
  overflow-y:auto!important;
}
.filtros,.filtros #toolbarModulo,.filtros .linha-filtros{
  overflow-y:visible!important;
}
</style>
<script>
(function(){
  'use strict';

  function posicionarListaSituacao(botao){
    const bloco=botao&&botao.closest('.filtro-situacao-check');
    const lista=bloco&&bloco.querySelector('.filtro-situacao-check-lista');
    if(!bloco||!lista)return;

    const r=botao.getBoundingClientRect();
    const largura=Math.max(280,Math.round(r.width));
    const margem=8;
    let esquerda=r.left;
    if(esquerda+largura>window.innerWidth-margem){
      esquerda=Math.max(margem,window.innerWidth-largura-margem);
    }

    lista.style.width=largura+'px';
    lista.style.left=Math.round(esquerda)+'px';
    lista.style.top=Math.round(r.bottom+6)+'px';
  }

  document.addEventListener('click',function(evento){
    const botao=evento.target.closest&&evento.target.closest('.filtro-situacao-check-botao');
    if(!botao)return;
    setTimeout(function(){posicionarListaSituacao(botao);},0);
  },true);

  window.addEventListener('resize',function(){
    document.querySelectorAll('.filtro-situacao-check.aberto .filtro-situacao-check-botao').forEach(posicionarListaSituacao);
  });

  window.addEventListener('scroll',function(){
    document.querySelectorAll('.filtro-situacao-check.aberto .filtro-situacao-check-botao').forEach(posicionarListaSituacao);
  },true);
})();
</script>
<script>
(function(){
  function normalizarTextoAjuste(v){return String(v||" ").trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
  function consolidarToolbarConvocar(){
    const linha=document.querySelector("#toolbarModulo .linha-filtros")||document.querySelector("#convocar .linha-filtros");
    if(!linha)return;
    const labels=[...linha.querySelectorAll("label")].filter(l=>normalizarTextoAjuste(l.textContent)==="SITUACAO");
    labels.forEach((label,indice)=>{if(indice>0)label.remove();});
    const desmarcar=linha.querySelector("button[onclick*=\"marcarConvocacoesVisiveis(false)\"]");
    if(desmarcar)desmarcar.textContent="Desmarcar";
  }
  document.addEventListener("DOMContentLoaded",()=>{setTimeout(consolidarToolbarConvocar,0);setTimeout(consolidarToolbarConvocar,500);});
  document.addEventListener("click",evento=>{if(evento.target.closest&&evento.target.closest("#abaConvocar"))setTimeout(consolidarToolbarConvocar,0);},true);
})();
</script>

<script>
(function(){
  'use strict';
  const $=(s,r=document)=>r.querySelector(s);
  const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
  function texto(el){return String(el&&el.textContent||'').trim().toLowerCase();}
  function dataBR(v){if(!v)return 'Selecionar período';const p=v.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:v;}
  function organizarFiltrosAgenda(){
    const filtros=$('.filtros'), topo=$('.topo'), linha=$('#convocar .linha-filtros');
    const inicio=$('#dataInicio'), fim=$('#dataFim'), pesquisa=$('#pesquisaConvocar');
    if(!filtros||!topo||!inicio||!fim||!pesquisa)return false;

    topo.classList.add('topo-com-filtros');
    let ferramentas=$('#painelTopbarTools');
    if(!ferramentas){ferramentas=document.createElement('div');ferramentas.id='painelTopbarTools';topo.appendChild(ferramentas);}
    const busca=pesquisa.closest('.campo-pesquisa')||pesquisa.parentElement;
    if(busca&&busca.parentElement!==ferramentas)ferramentas.prepend(busca);
    const atualiza=$$('button').find(b=>(b.getAttribute('onclick')||'').includes('atualizarDadosForcado'));
    if(atualiza&&atualiza.parentElement!==ferramentas)ferramentas.appendChild(atualiza);
    const sync=$('#painelSync')||$('#infoSincronizacaoAgenda');
    if(sync&&sync.parentElement!==ferramentas)ferramentas.insertBefore(sync,atualiza||null);

    let barra=$('#barraFiltrosAgenda');
    if(!barra){barra=document.createElement('div');barra.id='barraFiltrosAgenda';filtros.prepend(barra);}
    let seletor=$('#barraFiltrosAgenda .periodo-seletor');
    if(!seletor){
      seletor=document.createElement('div');seletor.className='periodo-seletor';
      seletor.innerHTML='<label>Período</label><button type="button" class="periodo-trigger" aria-haspopup="dialog" aria-expanded="false"><span></span><b aria-hidden="true">▾</b></button><div class="periodo-popover" role="dialog" aria-label="Selecionar período"><div class="periodo-campos"></div><button type="button" class="periodo-aplicar">Aplicar período</button></div>';
      barra.appendChild(seletor);
      const trigger=$('.periodo-trigger',seletor);
      trigger.addEventListener('click',()=>{const aberto=seletor.classList.toggle('aberto');trigger.setAttribute('aria-expanded',String(aberto));});
      $('.periodo-aplicar',seletor).addEventListener('click',()=>{
        const a=inicio.value,b=fim.value;
        if(!a||!b||a>b){alert('Selecione uma data inicial e uma data final válidas.');return;}
        seletor.classList.remove('aberto');trigger.setAttribute('aria-expanded','false');atualizarPeriodo();carregarDados(false);
      });
    }
    const pop=$('.periodo-campos',seletor);
    [inicio,fim].forEach((input,idx)=>{
      const caixa=input.closest('div');
      if(caixa&&caixa.parentElement!==pop){pop.appendChild(caixa);}
      input.removeAttribute('onchange');
      const label=caixa&&ca.querySelector('label');if(label)label.textContent=idx===0?'Data inicial':'Data final';
    });
    function atualizarPeriodo(){
      const span=$('.periodo-trigger span',seletor);
      if(span)span.textContent=(inicio.value&&fim.value)?dataBR(inicio.value)+' a '+dataBR(fim.value):'Selecionar período';
    }
    atualizarPeriodo();

    const barraPeriodo=$('.painel-topbar-periodo');
    const botoesPeriodo=$$('.periodo-atalho',barraPeriodo||filtros);
    let mesAtual=botoesPeriodo.find(b=>texto(b)==='mês atual');
    let mesSeguinte=botoesPeriodo.find(b=>['próximo mês','mes seguinte','mês seguinte'].includes(texto(b)));
    if(!mesAtual)mesAtual=$$('button').find(b=>texto(b)==='mês atual');
    if(!mesSeguinte)mesSeguinte=$$('button').find(b=>['próximo mês','mes seguinte','mês seguinte'].includes(texto(b)));
    const limpar=$('.painel-limpar-periodo');
    if(!mesAtual||!mesSeguinte||!limpar)return false;
    mesAtual.textContent='Mês atual';mesSeguinte.textContent='Mês seguinte';
    [mesAtual,mesSeguinte,limpar].forEach(b=>{if(b.parentElement!==barra)barra.appendChild(b);});
    if(!mesAtual.dataset.periodoAtualizado){mesAtual.addEventListener('click',()=>setTimeout(atualizarPeriodo,0));mesAtual.dataset.periodoAtualizado='1';}
    if(!mesSeguinte.dataset.periodoAtualizado){mesSeguinte.addEventListener('click',()=>setTimeout(atualizarPeriodo,0));mesSeguinte.dataset.periodoAtualizado='1';}

    const situacao=$('#barraFiltrosAgenda .filtro-situacao-check[data-tipo="convocar"]')||$('.filtro-situacao-check[data-tipo="convocar"]');
    const situacaoMultipla=$('.situacao-multipla:not(.situacao-complementares)');
    const controleSituacao=situacao||situacaoMultipla;
    const origem=$('.filtro-grupo-convocacao-v15');
    const email=$('#emailGestorConvocacao')?.closest('.email-gestor');
    const botoesAcao=$$('button');
    const enviar=botoesAcao.find(b=>(b.getAttribute('onclick')||'').includes('enviarSelecionadosGestor')||(b.getAttribute('onclick')||'').includes('enviarLoteGestor'));
    const pdf=botoesAcao.find(b=>(b.getAttribute('onclick')||'').includes('gerarSelecionadosEmLote'));
    if(!controleSituacao||!origem||!email||!enviar||!pdf)return false;
    [controleSituacao,origem,email,enviar,pdf].forEach(el=>{if(el.parentElement!==barra)barra.appendChild(el);});
    enviar.textContent='Enviar convocação';pdf.textContent='Gerar PDF selecionados';
    $$('button',linha||document).forEach(b=>{
      const acao=b.getAttribute('onclick')||'';
      if(acao.includes('marcarConvocacoesVisiveis')||acao.includes('gerarTodosVisiveisEmLote'))b.remove();
    });
    const desmarcar=$$('button',barra).find(b=>(b.getAttribute('onclick')||'').includes('marcarConvocacoesVisiveis(false)'));
    if(desmarcar)desmarcar.remove();
    if(linha&&linha!==barra&&!linha.querySelector('#pesquisaConvocar'))linha.style.display='none';

    if(!limpar.dataset.limpezaFinal){
      limpar.onclick=function(){
        const h=new Date(),ini=new Date(h.getFullYear(),h.getMonth(),1),fm=new Date(h.getFullYear(),h.getMonth()+1,0);
        inicio.value=formatarDataInput(ini);fim.value=formatarDataInput(fm);
        const campo=$('#pesquisaConvocar');if(campo)campo.value='';
        const grupo=$('#filtroGrupoConvocacaoV15');if(grupo)grupo.value='';
        $$('.filtro-situacao-check[data-tipo="convocar"] input:not(:disabled)').forEach(cb=>{if(cb.checked){cb.checked=false;cb.dispatchEvent(new Event('change',{bubbles:true}));}});
        const gestor=$('#emailGestorConvocacao');if(gestor)gestor.value='';
        atualizarPeriodo();seletor.classList.remove('aberto');carregarDados(false);
      };
      limpar.dataset.limpezaFinal='1';
    }
    $$('button',barra).forEach(b=>{if(b!==mesAtual&&b!==mesSeguinte&&b!==limpar&&b!==enviar&&b!==pdf&&!b.classList.contains('periodo-trigger')&&!b.classList.contains('periodo-aplicar'))b.remove();});
    return true;
  }
  let tentativas=0,temporizador;
  function iniciar(){if(organizarFiltrosAgenda()||tentativas++>80)clearInterval(temporizador);}
  document.addEventListener('DOMContentLoaded',()=>{temporizador=setInterval(iniciar,350);iniciar();});
  window.addEventListener('load',iniciar);
  document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#abaConvocar'))setTimeout(iniciar,250);});
  const observador=new MutationObserver(()=>{if($('#convocar')&&$('#convocar').style.display!=='none')setTimeout(iniciar,0);});
  document.addEventListener('DOMContentLoaded',()=>{const a=$('#convocar');if(a)observador.observe(a,{childList:true,subtree:true});});
})();
</script>
