<script>
(function(){
  const FIXAS=['ATIVO','FERIAS'];
  let selecionadas=new Set(FIXAS),tokenGeral=0;
  const norm=v=>String(v||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

  function removerLimparAntigo(){
    document.querySelectorAll('.filtros>button,#toolbarModulo>button,.linha-filtros>button').forEach(b=>{
      if(b.textContent.trim().toLowerCase()==='limpar'&&!b.classList.contains('painel-limpar-periodo'))b.remove();
    });
  }

  function moverPeriodo(){
    const top=document.querySelector('.painel-topbar'),atualizar=top&&top.querySelector('.painel-atualizar');
    const filtros=document.querySelector('.filtros'),inicio=document.getElementById('dataInicio'),fim=document.getElementById('dataFim');
    if(!top||!atualizar||!filtros||!inicio||!fim)return;
    removerLimparAntigo();
    if(top.querySelector('.painel-topbar-periodo'))return;
    const bloco=document.createElement('div');bloco.className='painel-topbar-acoes';
    const periodo=document.createElement('div');periodo.className='painel-topbar-periodo';
    periodo.appendChild(inicio.closest('div'));periodo.appendChild(fim.closest('div'));
    const filtrar=[...filtros.querySelectorAll('button')].find(b=>b.textContent.trim().toLowerCase()==='filtrar');
    if(filtrar)periodo.appendChild(filtrar);
    const limpar=document.createElement('button');limpar.type='button';limpar.className='painel-limpar-periodo';limpar.textContent='Limpar';
    limpar.onclick=function(){
      const h=new Date(),ini=new Date(h.getFullYear(),h.getMonth(),1),fm=new Date(h.getFullYear(),h.getMonth()+1,0);
      inicio.value=formatarDataInput(ini);fim.value=formatarDataInput(fm);resetarSituacoes();
      document.querySelectorAll('.linha-filtros input[type="text"],.linha-filtros input[type="email"]').forEach(el=>el.value='');
      document.querySelectorAll('.linha-filtros select').forEach(el=>el.value='');
      carregarDados(false);
    };
    periodo.appendChild(limpar);bloco.appendChild(periodo);bloco.appendChild(atualizar);top.appendChild(bloco);
  }

  function situacoesDisponiveis(){
    const lista=dadosPortal&&dadosPortal.convocar&&dadosPortal.convocar.todos||[];
    return[...new Set(lista.map(i=>i.situacao).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  }
  function atualizarResumoSituacoes(){
    const b=document.querySelector('.situacao-multipla-botao');if(!b)return;
    const nomes=situacoesDisponiveis().filter(s=>selecionadas.has(norm(s)));
    b.textContent=nomes.length<=2?nomes.join(', '):nomes.slice(0,2).join(', ')+' +'+(nomes.length-2);
  }
  function aplicarSituacoes(){
    if(!dadosPortal||!dadosPortal.convocar)return;
    const termo=obterTermoPesquisa('pesquisaConvocar');
    renderizarConvocar((dadosPortal.convocar.todos||[]).filter(i=>selecionadas.has(norm(i.situacao))&&correspondePesquisa(i,termo)));
    quebrarCabecalhos();
  }
  function resetarSituacoes(){
    selecionadas=new Set(FIXAS);
    document.querySelectorAll('.situacao-multipla-lista input').forEach(cb=>cb.checked=FIXAS.includes(cb.dataset.normalizada));
    atualizarResumoSituacoes();aplicarSituacoes();
  }
  function montarFiltroSituacao(){
    const select=document.getElementById('filtroSituacaoConvocar');if(!select)return;
    const existente=document.querySelector('.situacao-multipla');if(existente){atualizarResumoSituacoes();return;}
    const pai=select.closest('div');if(!pai)return;
    const controle=document.createElement('div');controle.className='situacao-multipla';
    controle.innerHTML='<button type="button" class="situacao-multipla-botao">Ativo, Férias</button><div class="situacao-multipla-lista"></div>';
    pai.appendChild(controle);const lista=controle.querySelector('.situacao-multipla-lista');
    situacoesDisponiveis().forEach(s=>{
      const n=norm(s),fixa=FIXAS.includes(n),label=document.createElement('label');label.className='situacao-opcao'+(fixa?' fixa':'');
      label.innerHTML='<input type="checkbox" data-normalizada="'+n.replace(/"/g,'&quot;')+'" '+(fixa?'checked disabled':'')+'><span></span>';
      label.querySelector('span').textContent=s;const cb=label.querySelector('input');
      cb.onchange=()=>{cb.checked?selecionadas.add(n):selecionadas.delete(n);atualizarResumoSituacoes();aplicarSituacoes();};
      lista.appendChild(label);
    });
    controle.querySelector('.situacao-multipla-botao').onclick=()=>controle.classList.toggle('aberta');
    atualizarResumoSituacoes();
  }

  function quebrarCabecalhos(){
    const mapa={'DATA CONVOCAR':'Data<br>convocar','DATA LIMITE':'Data<br>limite','DATA AGENDADA':'Data<br>agendada','STATUS AGENDA':'Status<br>agenda','ULTIMA PENDENCIA':'Última<br>pendência','NOVA DATA':'Nova<br>data','PROX. VENC.':'Próx.<br>venc.','DATA LIMITE PARA REALIZAR':'Data limite<br>para realizar','DATA REALIZADA':'Data<br>realizada','VENCIMENTO AVALIADO':'Vencimento<br>avaliado','MES ANALISADO':'Mês<br>analisado'};
    document.querySelectorAll('.conteudo table thead th').forEach(th=>{if(th.querySelector('input'))return;const k=norm(th.textContent).replace(/\s+/g,' ');if(mapa[k]&&th.dataset.quebrado!=='1'){th.innerHTML=mapa[k];th.dataset.quebrado='1';}});
  }

  function carregarGeralSeguro(){
    const inicio=document.getElementById('dataInicio')?.value||'',fim=document.getElementById('dataFim')?.value||'';
    if(!inicio||!fim)return;const meuToken=++tokenGeral;
    const div=document.getElementById('tabelaColaboradores');if(div)div.innerHTML='<div class="vazio">Carregando colaboradores...</div>';
    google.script.run.withSuccessHandler(r=>{
      if(meuToken!==tokenGeral)return;
      const atualInicio=document.getElementById('dataInicio')?.value||'',atualFim=document.getElementById('dataFim')?.value||'';
      if(atualInicio!==inicio||atualFim!==fim)return;
      dadosPortal=Object.assign(dadosPortal||{},r||{});filtrarColaboradores();quebrarCabecalhos();
    }).withFailureHandler(e=>{if(meuToken===tokenGeral&&div)div.innerHTML='<div class="vazio">Erro ao carregar colaboradores: '+escaparHtml(e.message||e)+'</div>';}).obterModuloPortalV13('COLABORADORES',inicio,fim,false);
  }

  window.carregarFiltroSituacao=function(){montarFiltroSituacao();atualizarResumoSituacoes();};
  window.filtrarConvocacaoPorSituacao=aplicarSituacoes;
  const limparOriginal=window.limparFiltrosLocais;window.limparFiltrosLocais=function(){if(typeof limparOriginal==='function')limparOriginal();resetarSituacoes();};
  const abrirOriginal=window.abrirAba;window.abrirAba=function(id,botao){abrirOriginal(id,botao);removerLimparAntigo();setTimeout(()=>{montarFiltroSituacao();quebrarCabecalhos();ajustarIndicadores();if(id==='colaboradores')carregarGeralSeguro();},0);};

  const renderComplementaresOriginal=window.renderizarComplementares;
  window.renderizarComplementares=function(lista){
    if(typeof renderComplementaresOriginal==='function')renderComplementaresOriginal(lista);
    const tabela=document.querySelector('#tabelaComplementares table');if(tabela&&!tabela.querySelector('th[data-situacao]')){
      tabela.querySelectorAll('tr').forEach((tr,idx)=>{const cel=document.createElement(idx===0?'th':'td');if(idx===0){cel.textContent='Situação';cel.dataset.situacao='1';tr.insertBefore(cel,tr.children[5]||null);}else{const item=(lista||[])[idx-1];cel.textContent=item&&item.situacao||'';tr.insertBefore(cel,tr.children[5]||null);}});
    }
    quebrarCabecalhos();
  };

  function ajustarIndicadores(){
    const grafico=document.getElementById('graficoMetaMensal');if(grafico){const titulo=grafico.previousElementSibling;if(titulo&&norm(titulo.textContent)==='DESEMPENHO MENSAL DA META')titulo.remove();grafico.remove();}
    document.querySelectorAll('#analiseIndicadorMensal .analise-bloco h3 span:first-child').forEach(s=>{if(norm(s.textContent).includes('ASOS ATRASADOS REALIZADOS NO MES DA ANALISE'))s.textContent='Atrasados no vencimento — relação nominal';});
    quebrarCabecalhos();
  }
  const renderIndicadoresOriginal=window.renderizarIndicadores;window.renderizarIndicadores=function(ind){if(typeof renderIndicadoresOriginal==='function')renderIndicadoresOriginal(ind);ajustarIndicadores();};

  function iniciar(){moverPeriodo();removerLimparAntigo();montarFiltroSituacao();quebrarCabecalhos();ajustarIndicadores();}
  document.addEventListener('DOMContentLoaded',()=>{setTimeout(iniciar,0);setTimeout(iniciar,300);});
})();
</script>
